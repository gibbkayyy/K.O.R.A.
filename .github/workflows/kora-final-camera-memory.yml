name: KORA final camera memory patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[kora-final]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch index.html
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('public/index.html')
          s = p.read_text(encoding='utf-8')
          if 'KORA_FINAL_PATCH_V1' in s:
              raise SystemExit(0)

          # Replace the two vision-command functions with broad, natural voice handling.
          open_fn = r'''function isCameraOpenCommand(
  text
) {

  const t = normalise(stripWakeWord(text))
    .replace(/\s+/g, " ")
    .trim();

  const exact = [
    "camera",
    "open camera",
    "open the camera",
    "show camera",
    "show the camera",
    "use camera",
    "use the camera",
    "turn on camera",
    "turn on the camera",
    "activate camera",
    "activate the camera",
    "bring up camera",
    "bring up the camera",
    "bring up the camera feed",
    "start camera",
    "start the camera",
    "launch camera",
    "launch the camera"
  ];

  return exact.includes(t) ||
    /\b(open|show|use|turn on|activate|start|launch|bring up)\b.*\bcamera\b/.test(t) ||
    /\bcamera\b.*\b(open|show|use|turn on|activate|start|launch)\b/.test(t);
}'''

          analyse_fn = r'''function isCameraAnalyseCommand(
  text
) {

  const t = normalise(stripWakeWord(text))
    .replace(/\s+/g, " ")
    .trim();

  const phrases = [
    "look at this",
    "look at that",
    "look again",
    "look through the camera",
    "look through camera",
    "look at the camera",
    "what can you see",
    "what do you see",
    "tell me what you can see",
    "tell me what you see",
    "what am i looking at",
    "what am i seeing",
    "what is this",
    "what's this",
    "can you see this",
    "can you see that",
    "analyse",
    "analyze",
    "analyse this",
    "analyze this",
    "analyse that",
    "analyze that",
    "analyse again",
    "analyze again",
    "analyse image",
    "analyze image",
    "analyse the image",
    "analyze the image",
    "analyse camera",
    "analyze camera",
    "analyse the camera",
    "analyze the camera",
    "analyse what you see",
    "analyze what you see",
    "scan this",
    "scan that",
    "scan the camera",
    "scan the image",
    "identify this",
    "identify that",
    "identify what you see",
    "identify the object",
    "identify the objects",
    "identify what is in front of me"
  ];

  if (phrases.some(phrase => t === phrase || t.includes(phrase))) {
    return true;
  }

  // Natural camera/scan/identify requests: if the user explicitly refers
  // to the camera, scanning, or identifying something, use vision rather
  // than sending the request to ordinary chat.
  return (
    /\bcamera\b/.test(t) && /\b(look|see|analyse|analyze|identify|describe|what|tell|scan)\b/.test(t)
  ) || (
    /\b(scan|scanning)\b/.test(t) && /\b(this|that|image|camera|here|what|see|identify)\b/.test(t)
  ) || (
    /\bidentify\b/.test(t) && /\b(this|that|what|object|image|camera|see|here)\b/.test(t)
  );
}'''

          s, n1 = re.subn(r'function isCameraOpenCommand\(\s*text\s*\)\s*\{.*?\n\}', open_fn, s, count=1, flags=re.S)
          s, n2 = re.subn(r'function isCameraAnalyseCommand\(\s*text\s*\)\s*\{.*?\n\}', analyse_fn, s, count=1, flags=re.S)

          # Keep the explicit camera command behaviour: opening the camera
          # announces itself, while analysis opens silently and captures.
          # This also makes "look at the camera" an analysis request.

          # Persist conversation locally so a refresh does not erase KORA's
          # conversational memory. The backend still receives the recent
          # conversation on every request.
          memory_js = r'''

/* KORA_FINAL_PATCH_V1: persistent conversation memory */
const KORA_MEMORY_KEY = "kora_conversation_memory_v1";

function loadKoraMemory() {
  try {
    const saved = JSON.parse(localStorage.getItem(KORA_MEMORY_KEY) || "[]");
    return Array.isArray(saved) ? saved : [];
  } catch {
    return [];
  }
}

function saveKoraMemory() {
  try {
    localStorage.setItem(KORA_MEMORY_KEY, JSON.stringify(messages.slice(-200)));
  } catch {}
}
'''
          marker = '/* =====================================================\n   SPEECH\n===================================================== */'
          if marker in s:
              s = s.replace(marker, memory_js + '\n\n' + marker, 1)

          # Initialise existing messages from local storage if the declaration
          # is the normal empty-array form.
          s = re.sub(r'let messages\s*=\s*\[\];', 'let messages = loadKoraMemory();', s, count=1)
          s = re.sub(r'const messages\s*=\s*\[\];', 'const messages = loadKoraMemory();', s, count=1)

          # Save after user and assistant messages are appended.
          s = s.replace('''      messages.push({\n        role: "user",\n        content: text\n      });''', '''      messages.push({\n        role: "user",\n        content: text\n      });\n\n      saveKoraMemory();''', 1)
          s = s.replace('''    messages.push({\n\n      role: "assistant",\n\n      content: reply\n\n    });''', '''    messages.push({\n\n      role: "assistant",\n\n      content: reply\n\n    });\n\n    saveKoraMemory();''', 1)

          # Make the supplied camera image the source of truth for vision;
          # don't allow normal chat to deny a camera image that the app has supplied.
          s = s.replace(
              'Do not claim to have access to WhatsApp, TikTok, YouTube, messages, contacts, camera, microphone, files, or other private services unless the application has explicitly provided the required data.\n\nIf the user asks about capabilities that require permission, explain what permission or integration is needed.',
              'Do not claim to access hardware directly. When the application supplies a camera image to the vision backend, analyse that supplied image normally and do not say that you cannot access the camera.'
          )

          # The current orb is too small, especially after camera/info mode scaling.
          # Increase the actual logo and its rings while keeping it responsive.
          logo_css = r'''

/* KORA_FINAL_PATCH_V1: large, stable K.O.R.A. logo */
.core {
  width: 620px !important;
  height: 620px !important;
}

.orb {
  width: 250px !important;
  height: 250px !important;
}

.ring-a { width: 315px !important; height: 315px !important; }
.ring-b { width: 390px !important; height: 390px !important; }
.ring-c { width: 465px !important; height: 465px !important; }

.orb-name {
  font-size: 25px !important;
  letter-spacing: .18em !important;
  transform: translate(-50%, -50%) scale(1) !important;
}

.app.listening .orb-name,
.app.thinking .orb-name,
.app.speaking .orb-name {
  transform: translate(-50%, -50%) scale(1) !important;
}

.core.info-mode { transform: translate(0,0) scale(.62) !important; }
.core.camera-mode { transform: translate(0,0) scale(.62) !important; }

@media (max-width: 700px) {
  .core { width: 500px !important; height: 500px !important; }
  .orb { width: 215px !important; height: 215px !important; }
  .ring-a { width: 275px !important; height: 275px !important; }
  .ring-b { width: 335px !important; height: 335px !important; }
  .ring-c { width: 400px !important; height: 400px !important; }
  .orb-name { font-size: 21px !important; }
  .core.info-mode { transform: translate(0,0) scale(.52) !important; }
  .core.camera-mode { transform: translate(0,0) scale(.52) !important; }
}
'''
          s = s.replace('</style>', logo_css + '\n</style>', 1)

          p.write_text(s, encoding='utf-8')

      - name: Commit patched index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html
          git commit -m "fix KORA camera analysis memory and logo [kora-final]" || exit 0
          git push
