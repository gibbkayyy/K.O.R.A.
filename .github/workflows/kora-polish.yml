name: KORA polish

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  polish:
    if: ${{ !contains(github.event.head_commit.message, '[kora-polish]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch KORA frontend
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('public/index.html')
          s = p.read_text(encoding='utf-8')

          if 'KORA_POLISH_V1' in s:
              raise SystemExit(0)

          # Keep every existing design rule, but prevent the orb label from
          # inheriting any listening-state scale animation.
          style_patch = r'''

/* KORA_POLISH_V1: stable orb label during listening */
.app.listening .orb {
  animation: listenPulse 1.8s ease-in-out infinite !important;
  transform: translate(-50%, -50%) !important;
}

.app.listening .orb-name {
  font-size: 19px !important;
  line-height: 1 !important;
  transform: translate(-50%, -50%) scale(1) !important;
  animation: textBoot .7s ease 1.7s forwards !important;
}

/* Never let the listening pulse alter the K.O.R.A. lettering itself. */
.app.listening .orb-name,
.app.thinking .orb-name,
.app.speaking .orb-name {
  transform-origin: center center;
}
'''
          if '</style>' in s:
              s = s.replace('</style>', style_patch + '\n</style>', 1)

          # Make camera opening tolerant of natural voice phrasing.
          camera_open = r'''function isCameraOpenCommand(
  text
) {

  const t = normalise(stripWakeWord(text))
    .replace(/\s+/g, ' ')
    .trim();

  const phrases = [
    'camera',
    'open camera',
    'open the camera',
    'show camera',
    'show the camera',
    'turn on camera',
    'turn on the camera',
    'activate camera',
    'activate the camera',
    'bring up the camera',
    'bring up the camera feed',
    'do me a favour and open camera',
    'do me a favour and open the camera',
    'do me a favour and show camera',
    'do me a favour and show the camera',
    'do me a favor and open camera',
    'do me a favor and open the camera',
    'do me a favor and show camera',
    'do me a favor and show the camera'
  ];

  return phrases.some(phrase => t === phrase || t.includes(phrase));
}'''
          s, n = re.subn(
              r'function isCameraOpenCommand\(\s*text\s*\)\s*\{.*?\n\}',
              camera_open,
              s,
              count=1,
              flags=re.S
          )

          camera_analyse = r'''function isCameraAnalyseCommand(
  text
) {

  const t = normalise(stripWakeWord(text))
    .replace(/\s+/g, ' ')
    .trim();

  const phrases = [
    'look at this',
    'look at that',
    'look again',
    'look through the camera',
    'analyse this',
    'analyse that',
    'analyse again',
    'analyze this',
    'analyze that',
    'analyze again',
    'what do you see',
    'what am i looking at',
    'what is this',
    "what's this",
    'what am i seeing',
    'scan this',
    'scan that',
    'can you see this',
    'can you see that'
  ];

  return phrases.some(phrase => t === phrase || t.includes(phrase));
}'''
          s, n2 = re.subn(
              r'function isCameraAnalyseCommand\(\s*text\s*\)\s*\{.*?\n\}',
              camera_analyse,
              s,
              count=1,
              flags=re.S
          )

          # The normal chat prompt must not teach KORA to deny camera access
          # when the application has explicitly supplied a vision image.
          s = s.replace(
              'Do not claim to have access to WhatsApp, TikTok, YouTube, messages, contacts, camera, microphone, files, or other private services unless the application has explicitly provided the required data.\n\nIf the user asks about capabilities that require permission, explain what permission or integration is needed.',
              'Do not claim to access hardware directly. For a vision request, the application may explicitly supply a captured image to the vision backend; when that happens, analyse the supplied image normally instead of saying you cannot access the camera.'
          )

          s += '\n<!-- KORA_POLISH_V1 -->\n'
          p.write_text(s, encoding='utf-8')

      - name: Commit patched frontend
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html
          git commit -m "apply KORA vision and UI polish [kora-polish]" || exit 0
          git push
