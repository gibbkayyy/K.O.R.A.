name: Patch KORA camera

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-camera:
    if: ${{ !contains(github.event.head_commit.message, '[kora-camera-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch camera commands and behaviour
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path('public/index.html')
          text = path.read_text(encoding='utf-8')

          if 'KORA_CAMERA_PATCH_V2' in text:
              print('Camera patch already present.')
              raise SystemExit(0)

          old_camera = re.compile(
              r'function isCameraCommand\(\n  text\n\) \{.*?\n\}\n\n\n/\* =====================================================\n   HANDLE COMMAND',
              re.S,
          )

          new_camera = r'''/* =====================================================
   VISION COMMANDS
===================================================== */

function cameraCommandText(text) {
  return normalise(text)
    .replace(/\bhey\s+kora\b/g, "")
    .replace(/\bkora\b/g, "")
    .replace(/\s+/g, " ")
    .trim();
}

function isCameraAnalysisCommand(text) {
  const t = cameraCommandText(text);

  return (
    t.includes("look at this") ||
    t.includes("look at that") ||
    t.includes("what am i looking at") ||
    t.includes("what is this") ||
    t.includes("what's this") ||
    t.includes("can you see this") ||
    t.includes("look through the camera") ||
    t.includes("use the camera")
  );
}

function isCameraCommand(text) {
  const t = cameraCommandText(text);

  return (
    t === "camera" ||
    t === "open camera" ||
    t === "open the camera" ||
    t === "show camera" ||
    t === "show the camera" ||
    t.includes("open camera") ||
    t.includes("open the camera") ||
    t.includes("show camera") ||
    t.includes("show the camera") ||
    t.includes("do me a favour and open camera") ||
    t.includes("do me a favour and open the camera") ||
    t.includes("do me a favor and open camera") ||
    t.includes("do me a favor and open the camera") ||
    t.includes("do me a favour and show camera") ||
    t.includes("do me a favour and show the camera") ||
    t.includes("do me a favor and show camera") ||
    t.includes("do me a favor and show the camera")
  );
}


/* =====================================================
   HANDLE COMMAND'''

          patched, count = old_camera.subn(new_camera, text, count=1)
          if count != 1:
              raise SystemExit('Could not locate camera command block.')
          text = patched

          old_handle = '''  /*
   * Camera.
   */

  if (
    isCameraCommand(text)
  ) {

    await openCamera();

    return;
  }
'''

          new_handle = '''  /*
   * Camera / vision.
   * "Look at this" opens the camera silently and analyses
   * the current frame. Explicit camera-opening commands only
   * open the camera and do not trigger the vision model.
   */

  if (isCameraAnalysisCommand(text)) {
    if (cameraStream) {
      await analyseCamera();
    } else {
      await openCamera({
        announce: false,
        analyze: true
      });
    }
    return;
  }

  if (isCameraCommand(text)) {
    await openCamera({
      announce: true,
      analyze: false
    });
    return;
  }
'''

          if old_handle not in text:
              raise SystemExit('Could not locate camera handler block.')
          text = text.replace(old_handle, new_handle, 1)

          old_open = '''async function openCamera() {

  if (
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ) {'''

          new_open = '''async function openCamera(options = {}) {

  const announce =
    options.announce !== false;

  const analyze =
    options.analyze === true;

  if (
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ) {'''

          if old_open not in text:
              raise SystemExit('Could not locate openCamera function.')
          text = text.replace(old_open, new_open, 1)

          old_success = '''    transmission.textContent =
      "Camera active, Sir. Ask me what you'd like me to identify.";


    setState(
      "VISION ACTIVE",
      "Kora can see through the camera"
    );


    speakWithoutConfirmation(
      "Camera active, Sir. What would you like me to look at?"
    );'''

          new_success = '''    transmission.textContent =
      analyze
        ? "Camera active. Analysing what I can see, Sir."
        : "Camera active, Sir. Ask me what you'd like me to identify.";


    setState(
      "VISION ACTIVE",
      "Kora can see through the camera"
    );


    if (analyze) {
      const analyseWhenReady = async () => {
        try {
          await cameraVideo.play();
        } catch {}

        if (cameraVideo.videoWidth) {
          await analyseCamera();
        } else {
          transmission.textContent =
            "The camera is still starting, Sir. Please try again in a moment.";
        }
      };

      if (cameraVideo.readyState >= 2) {
        await analyseWhenReady();
      } else {
        await new Promise(resolve => {
          const done = () => {
            cameraVideo.removeEventListener("loadeddata", done);
            resolve();
          };
          cameraVideo.addEventListener("loadeddata", done, { once: true });
        });
        await analyseWhenReady();
      }

      return;
    }

    if (announce) {
      speakWithoutConfirmation(
        "Camera active, Sir. What would you like me to look at?"
      );
    }'''

          if old_success not in text:
              raise SystemExit('Could not locate camera success block.')
          text = text.replace(old_success, new_success, 1)

          old_catch = '''  } catch {

    transmission.textContent =
      "Camera permission was not granted, Sir.";

    speak(
      "Camera permission was not granted, Sir."
    );


    restartListening();
  }
}'''

          new_catch = '''  } catch (error) {

    const cameraMessage =
      error && error.name === "NotAllowedError"
        ? "Camera permission was blocked, Sir. Please allow camera access for K.O.R.A. and try again."
        : error && error.name === "NotFoundError"
          ? "I couldn't find a camera on this device, Sir."
          : error && error.name === "NotReadableError"
            ? "The camera is already being used by another app or tab, Sir."
            : "I couldn't start the camera, Sir.";

    transmission.textContent =
      cameraMessage;

    speak(
      cameraMessage
    );


    restartListening();
  }
}'''

          if old_catch not in text:
              raise SystemExit('Could not locate camera error block.')
          text = text.replace(old_catch, new_catch, 1)

          marker = '<!-- KORA_CAMERA_PATCH_V2 -->'
          text = text.replace('</script>', marker + '\n</script>', 1)
          path.write_text(text, encoding='utf-8')
          print('Camera patch applied.')
          PY

      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html
          git rm -f .github/workflows/patch-kora-camera.yml
          git commit -m "fix KORA camera commands [kora-camera-patched]"
          git push
