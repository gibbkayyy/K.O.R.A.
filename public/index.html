<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>K.O.R.A.</title>

<style>
  :root {
    --bg: #101112;
    --charcoal: #17191a;
    --panel: rgba(27, 29, 30, 0.88);
    --white: #f4f5f2;
    --soft-white: #d7dad7;
    --muted: #858b88;
    --green: #54d98b;
    --green-soft: rgba(84, 217, 139, 0.22);
    --line: rgba(255, 255, 255, 0.09);
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    width: 100%;
    height: 100%;
    margin: 0;
  }

  body {
    overflow: hidden;
    background:
      radial-gradient(
        circle at 50% 45%,
        rgba(255, 255, 255, 0.055),
        transparent 28%
      ),
      linear-gradient(
        135deg,
        #0d0e0f,
        #17191a 52%,
        #0c0d0e
      );

    color: var(--white);
    font-family:
      -apple-system,
      BlinkMacSystemFont,
      "Segoe UI",
      Roboto,
      Arial,
      sans-serif;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;

    background:
      linear-gradient(
        rgba(255,255,255,0.018) 1px,
        transparent 1px
      ),
      linear-gradient(
        90deg,
        rgba(255,255,255,0.018) 1px,
        transparent 1px
      );

    background-size: 46px 46px;

    mask-image:
      radial-gradient(
        circle,
        black 15%,
        transparent 78%
      );
  }

  /* ==================================================
     APP
  ================================================== */

  .app {
    width: 100%;
    height: 100%;
    position: relative;

    display: flex;
    flex-direction: column;

    opacity: 0;
    transform: scale(1.015);

    animation:
      appReveal 1.1s ease forwards;
  }

  @keyframes appReveal {
    to {
      opacity: 1;
      transform: scale(1);
    }
  }

  /* ==================================================
     TOP BAR
  ================================================== */

  .topbar {
    height: 72px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 30px;

    border-bottom:
      1px solid var(--line);

    background:
      rgba(14, 15, 16, 0.72);

    backdrop-filter:
      blur(18px);

    opacity: 0;

    animation:
      fadeDown 0.9s ease 1.1s forwards;
  }

  @keyframes fadeDown {
    from {
      opacity: 0;
      transform: translateY(-12px);
    }

    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .brand-mark {
    width: 28px;
    height: 28px;

    border-radius: 50%;

    border:
      1px solid rgba(255,255,255,0.45);

    display: grid;
    place-items: center;
  }

  .brand-mark::after {
    content: "";

    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: var(--green);

    box-shadow:
      0 0 10px var(--green);
  }

  .brand-name {
    font-size: 17px;
    font-weight: 650;

    letter-spacing: 0.18em;
  }

  .brand-sub {
    color: var(--muted);

    font-size: 9px;

    letter-spacing: 0.16em;

    margin-left: 5px;
  }

  .system {
    display: flex;
    align-items: center;
    gap: 9px;

    color: var(--muted);

    font-size: 9px;

    letter-spacing: 0.15em;
  }

  .system-dot {
    width: 6px;
    height: 6px;

    border-radius: 50%;

    background: var(--green);

    box-shadow:
      0 0 9px var(--green);
  }

  /* ==================================================
     MAIN
  ================================================== */

  .main {
    flex: 1;

    position: relative;

    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ==================================================
     CORE AREA
  ================================================== */

  .core-area {
    position: relative;

    width: 520px;
    height: 520px;

    max-width: 90vw;
    max-height: 65vh;

    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ==================================================
     CORE RINGS
  ================================================== */

  .ring {
    position: absolute;

    border-radius: 50%;

    pointer-events: none;

    opacity: 0;

    animation:
      ringAppear 1s ease 1.2s forwards;
  }

  @keyframes ringAppear {
    to {
      opacity: 1;
    }
  }

  .ring-one {
    width: 275px;
    height: 275px;

    border:
      1px solid rgba(255,255,255,0.13);

    animation:
      ringAppear 1s ease 1.2s forwards,
      slowRotate 24s linear 2.2s infinite;
  }

  .ring-two {
    width: 325px;
    height: 325px;

    border:
      1px dashed rgba(255,255,255,0.075);

    animation:
      ringAppear 1s ease 1.4s forwards,
      slowRotateReverse 30s linear 2.4s infinite;
  }

  .ring-three {
    width: 380px;
    height: 380px;

    border:
      1px solid rgba(255,255,255,0.045);

    animation:
      ringAppear 1s ease 1.6s forwards;
  }

  @keyframes slowRotate {
    to {
      transform: rotate(360deg);
    }
  }

  @keyframes slowRotateReverse {
    to {
      transform: rotate(-360deg);
    }
  }

  .ring-one::before,
  .ring-one::after {
    content: "";

    position: absolute;

    width: 5px;
    height: 5px;

    border-radius: 50%;

    background: var(--green);

    box-shadow:
      0 0 10px var(--green);
  }

  .ring-one::before {
    top: 18px;
    left: 50%;
  }

  .ring-one::after {
    bottom: 30px;
    right: 23px;
  }

  /* ==================================================
     CORE
  ================================================== */

  .core {
    position: relative;

    width: 24px;
    height: 24px;

    border-radius: 50%;

    border:
      1px solid rgba(255,255,255,0.7);

    background:
      radial-gradient(
        circle,
        rgba(255,255,255,0.13),
        rgba(30,32,33,0.96)
      );

    display: flex;
    align-items: center;
    justify-content: center;

    cursor: pointer;

    z-index: 5;

    box-shadow:
      0 0 0 rgba(255,255,255,0);

    animation:
      coreBoot 1.45s
      cubic-bezier(0.16,1,0.3,1)
      0.35s
      forwards;

    transition:
      box-shadow 0.35s ease,
      transform 0.35s ease,
      border-color 0.35s ease;
  }

  @keyframes coreBoot {
    0% {
      width: 24px;
      height: 24px;

      opacity: 0;

      transform: scale(0.4);
    }

    45% {
      opacity: 1;
    }

    100% {
      width: 178px;
      height: 178px;

      opacity: 1;

      transform: scale(1);

      box-shadow:
        0 0 30px rgba(255,255,255,0.08),
        0 0 80px rgba(255,255,255,0.035),
        inset 0 0 35px rgba(255,255,255,0.045);
    }
  }

  .core:hover {
    transform: scale(1.025);

    border-color:
      rgba(255,255,255,0.95);

    box-shadow:
      0 0 38px rgba(255,255,255,0.1),
      0 0 90px rgba(255,255,255,0.035);
  }

  .core-inner {
    width: 112px;
    height: 112px;

    border-radius: 50%;

    border:
      1px solid rgba(255,255,255,0.13);

    display: flex;
    align-items: center;
    justify-content: center;

    opacity: 0;

    animation:
      innerAppear 0.9s ease 1.2s forwards;
  }

  @keyframes innerAppear {
    from {
      opacity: 0;
      transform: scale(0.75);
    }

    to {
      opacity: 1;
      transform: scale(1);
    }
  }

  .core-symbol {
    width: 46px;
    height: 46px;

    border-radius: 50%;

    border:
      2px solid var(--green);

    position: relative;

    box-shadow:
      0 0 15px rgba(84,217,139,0.28);
  }

  .core-symbol::before {
    content: "";

    position: absolute;

    width: 17px;
    height: 17px;

    top: 50%;
    left: 50%;

    transform:
      translate(-50%, -50%);

    border-radius: 50%;

    background: var(--green);

    box-shadow:
      0 0 18px var(--green);
  }

  .core-symbol::after {
    content: "";

    position: absolute;

    width: 6px;
    height: 6px;

    top: 50%;
    left: 50%;

    transform:
      translate(-50%, -50%);

    border-radius: 50%;

    background: white;
  }

  /* ==================================================
     K.O.R.A. TEXT
  ================================================== */

  .core-name {
    position: absolute;

    bottom: 32px;

    left: 50%;

    transform:
      translateX(-50%)
      translateY(8px);

    font-size: 10px;

    letter-spacing: 0.42em;

    font-weight: 600;

    color: rgba(255,255,255,0.9);

    white-space: nowrap;

    opacity: 0;

    animation:
      textFadeIn
      1s
      ease
      1.7s
      forwards;
  }

  @keyframes textFadeIn {
    from {
      opacity: 0;
      transform:
        translateX(-50%)
        translateY(8px);
    }

    to {
      opacity: 1;
      transform:
        translateX(-50%)
        translateY(0);
    }
  }

  /* ==================================================
     STATUS
  ================================================== */

  .status {
    position: absolute;

    bottom: 4px;

    left: 0;
    right: 0;

    text-align: center;

    opacity: 0;

    animation:
      textFadeIn
      0.9s
      ease
      2.05s
      forwards;
  }

  .status-main {
    font-size: 12px;

    letter-spacing: 0.23em;

    text-transform: uppercase;

    color: var(--soft-white);
  }

  .status-sub {
    margin-top: 8px;

    font-size: 9px;

    letter-spacing: 0.12em;

    color: var(--muted);
  }

  /* ==================================================
     LISTENING / THINKING / SPEAKING
  ================================================== */

  .listening .core {
    border-color: var(--green);

    box-shadow:
      0 0 32px rgba(84,217,139,0.14),
      0 0 80px rgba(84,217,139,0.045),
      inset 0 0 35px rgba(84,217,139,0.06);
  }

  .listening .core-symbol {
    animation:
      listeningPulse
      1.5s
      ease-in-out
      infinite;
  }

  .thinking .core {
    animation:
      thinkingPulse
      0.9s
      ease-in-out
      infinite;
  }

  .speaking .core {
    animation:
      speakingPulse
      0.7s
      ease-in-out
      infinite;
  }

  .speaking .core-symbol::before {
    animation:
      voicePulse
      0.22s
      ease-in-out
      infinite alternate;
  }

  @keyframes listeningPulse {
    0%,100% {
      box-shadow:
        0 0 28px rgba(84,217,139,0.12),
        0 0 70px rgba(84,217,139,0.04);
    }

    50% {
      box-shadow:
        0 0 45px rgba(84,217,139,0.23),
        0 0 100px rgba(84,217,139,0.08);
    }
  }

  @keyframes thinkingPulse {
    0%,100% {
      transform: scale(1);
    }

    50% {
      transform: scale(1.035);
    }
  }

  @keyframes speakingPulse {
    0%,100% {
      transform: scale(1);
    }

    50% {
      transform: scale(1.045);
    }
  }

  @keyframes voicePulse {
    from {
      transform:
        translate(-50%, -50%)
        scale(0.8);
    }

    to {
      transform:
        translate(-50%, -50%)
        scale(1.2);
    }
  }

  /* ==================================================
     LATEST TRANSLATION
  ================================================== */

  .translation {
    position: absolute;

    left: 28px;
    bottom: 28px;

    width: min(390px, calc(100vw - 56px));

    padding: 16px 18px;

    border:
      1px solid var(--line);

    border-radius: 14px;

    background:
      var(--panel);

    backdrop-filter:
      blur(18px);

    opacity: 0;

    animation:
      translationAppear
      0.9s
      ease
      2.2s
      forwards;
  }

  @keyframes translationAppear {
    from {
      opacity: 0;
      transform:
        translateY(12px);
    }

    to {
      opacity: 1;
      transform:
        translateY(0);
    }
  }

  .translation-title {
    color: var(--muted);

    font-size: 9px;

    letter-spacing: 0.16em;

    text-transform: uppercase;

    margin-bottom: 9px;
  }

  .translation-text {
    color: var(--soft-white);

    font-size: 13px;

    line-height: 1.5;

    max-height: 90px;

    overflow-y: auto;
  }

  /* ==================================================
     FOOTER
  ================================================== */

  .footer {
    height: 54px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-top:
      1px solid var(--line);

    background:
      rgba(13,14,15,0.72);

    backdrop-filter:
      blur(18px);

    color: var(--muted);

    font-size: 9px;

    letter-spacing: 0.13em;

    opacity: 0;

    animation:
      fadeUp
      0.9s
      ease
      1.4s
      forwards;
  }

  @keyframes fadeUp {
    from {
      opacity: 0;
      transform:
        translateY(10px);
    }

    to {
      opacity: 1;
      transform:
        translateY(0);
    }
  }

  .mic {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .mic-dot {
    width: 6px;
    height: 6px;

    border-radius: 50%;

    background: var(--green);

    box-shadow:
      0 0 8px var(--green);
  }

  /* ==================================================
     ERROR
  ================================================== */

  .error {
    position: fixed;

    top: 88px;
    left: 50%;

    transform:
      translateX(-50%);

    z-index: 20;

    width: max-content;
    max-width: 90%;

    padding: 10px 16px;

    border:
      1px solid rgba(255,255,255,0.1);

    border-radius: 10px;

    background:
      rgba(18,19,20,0.96);

    color: var(--soft-white);

    font-size: 11px;

    display: none;

    text-align: center;
  }

  /* ==================================================
     MOBILE
  ================================================== */

  @media (max-width: 700px) {

    .topbar {
      padding: 0 18px;
    }

    .system {
      display: none;
    }

    .core-area {
      width: 100%;
      height: 58vh;
    }

    .ring-one {
      width: 240px;
      height: 240px;
    }

    .ring-two {
      width: 285px;
      height: 285px;
    }

    .ring-three {
      width: 330px;
      height: 330px;
    }

    @keyframes coreBoot {
      0% {
        width: 20px;
        height: 20px;

        opacity: 0;

        transform: scale(0.4);
      }

      45% {
        opacity: 1;
      }

      100% {
        width: 150px;
        height: 150px;

        opacity: 1;

        transform: scale(1);

        box-shadow:
          0 0 28px rgba(255,255,255,0.08),
          0 0 70px rgba(255,255,255,0.035),
          inset 0 0 30px rgba(255,255,255,0.045);
      }
    }

    .core-inner {
      width: 95px;
      height: 95px;
    }

    .translation {
      left: 14px;
      bottom: 14px;

      width:
        calc(100vw - 28px);

      padding: 13px 15px;
    }

    .translation-text {
      max-height: 60px;
    }

    .footer {
      height: 48px;
    }
  }
</style>
</head>

<body>

<div class="app" id="app">

  <header class="topbar">

    <div class="brand">

      <div class="brand-mark"></div>

      <div>
        <span class="brand-name">K.O.R.A.</span>
        <span class="brand-sub">AI ASSISTANT</span>
      </div>

    </div>

    <div class="system">
      <span class="system-dot"></span>
      SYSTEM ONLINE
    </div>

  </header>

  <main class="main">

    <section
      class="core-area"
      id="coreArea"
    >

      <div class="ring ring-one"></div>
      <div class="ring ring-two"></div>
      <div class="ring ring-three"></div>

      <button
        class="core"
        id="core"
        aria-label="Talk to Kora"
      >

        <div class="core-inner">

          <div class="core-symbol"></div>

        </div>

        <div class="core-name">
          K.O.R.A.
        </div>

      </button>

      <div class="status">

        <div
          class="status-main"
          id="statusMain"
        >
          INITIALISING
        </div>

        <div
          class="status-sub"
          id="statusSub"
        >
          Preparing voice interface
        </div>

      </div>

    </section>

    <div class="translation">

      <div class="translation-title">
        Latest transmission
      </div>

      <div
        class="translation-text"
        id="translationText"
      >
        Kora is preparing.
      </div>

    </div>

  </main>

  <footer class="footer">

    <div class="mic">

      <span class="mic-dot"></span>

      <span id="micStatus">
        MICROPHONE READY
      </span>

    </div>

  </footer>

</div>

<div
  class="error"
  id="error"
></div>

<script>

  const CHAT_ENDPOINT = "/api/chat";

  const app =
    document.getElementById("app");

  const core =
    document.getElementById("core");

  const statusMain =
    document.getElementById("statusMain");

  const statusSub =
    document.getElementById("statusSub");

  const translationText =
    document.getElementById("translationText");

  const micStatus =
    document.getElementById("micStatus");

  const errorElement =
    document.getElementById("error");


  /* ==================================================
     STATE
  ================================================== */

  let messages = [];

  let recognition = null;

  let recognitionRunning = false;

  let processing = false;

  let koraSpeaking = false;

  let keepListening = true;

  let selectedVoice = null;


  /* ==================================================
     SPEECH RECOGNITION
  ================================================== */

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  const recognitionSupported =
    !!SpeechRecognition;


  if (recognitionSupported) {

    recognition =
      new SpeechRecognition();

    recognition.lang =
      "en-GB";

    recognition.continuous =
      true;

    recognition.interimResults =
      false;

    recognition.maxAlternatives =
      1;


    recognition.onstart =
      function () {

        recognitionRunning =
          true;

        if (!koraSpeaking) {

          setState(
            "LISTENING",
            "Kora is listening"
          );

          micStatus.textContent =
            "MICROPHONE ACTIVE";
        }
      };


    recognition.onresult =
      function (event) {

        if (koraSpeaking) {
          return;
        }

        const result =
          event.results[
            event.results.length - 1
          ];

        if (!result || !result.isFinal) {
          return;
        }

        const text =
          result[0]
            .transcript
            .trim();

        if (!text) {
          return;
        }

        stopListening();

        sendToKora(text);
      };


    recognition.onerror =
      function (event) {

        recognitionRunning =
          false;

        if (
          event.error ===
            "no-speech" ||
          event.error ===
            "aborted"
        ) {

          restartListening();

          return;
        }

        if (
          event.error ===
          "not-allowed"
        ) {

          keepListening =
            false;

          setState(
            "MICROPHONE BLOCKED",
            "Allow microphone access for Kora"
          );

          micStatus.textContent =
            "MICROPHONE PERMISSION REQUIRED";

          showError(
            "Kora needs microphone permission."
          );

          return;
        }

        restartListening();
      };


    recognition.onend =
      function () {

        recognitionRunning =
          false;

        if (
          keepListening &&
          !koraSpeaking &&
          !processing
        ) {

          restartListening();
        }
      };

  } else {

    setState(
      "VOICE UNAVAILABLE",
      "Use a supported browser"
    );

    micStatus.textContent =
      "VOICE INPUT UNAVAILABLE";
  }


  /* ==================================================
     VOICE SELECTION
  ================================================== */

  function chooseVoice() {

    if (
      !window.speechSynthesis
    ) {
      return;
    }

    const voices =
      window.speechSynthesis
        .getVoices();

    if (!voices.length) {
      return;
    }


    const english =
      voices.filter(
        function (voice) {

          return /^en(-|_)/i
            .test(voice.lang);
        }
      );


    /*
     * Prefer natural/neural-style voices.
     * Different operating systems expose
     * different names, so we use several
     * possibilities.
     */

    const preferredNames = [

      "Microsoft Jenny",
      "Microsoft Aria",
      "Microsoft Sonia",
      "Microsoft Libby",
      "Microsoft Zira",

      "Google UK English Female",
      "Google US English",

      "Samantha",
      "Karen",
      "Victoria",
      "Moira",
      "Fiona",
      "Serena",
      "Ava",
      "Allison",
      "Emma",
      "Joanna",
      "Jenny",
      "Aria"
    ];


    for (
      const preferred
      of preferredNames
    ) {

      const match =
        english.find(
          function (voice) {

            return voice.name
              .toLowerCase()
              .includes(
                preferred.toLowerCase()
              );
          }
        );

      if (match) {

        selectedVoice =
          match;

        return;
      }
    }


    /*
     * Next, look for female markers.
     */

    const femaleMarkers = [

      "female",
      "woman",
      "samantha",
      "karen",
      "victoria",
      "moira",
      "fiona",
      "serena",
      "jenny",
      "aria",
      "libby",
      "sonia",
      "zira",
      "susan"
    ];


    const female =
      english.find(
        function (voice) {

          const name =
            voice.name
              .toLowerCase();

          return femaleMarkers.some(
            function (marker) {

              return name.includes(
                marker
              );
            }
          );
        }
      );


    if (female) {

      selectedVoice =
        female;

      return;
    }


    /*
     * Prefer British English.
     */

    const british =
      english.find(
        function (voice) {

          return /GB|UK/i
            .test(voice.lang);
        }
      );


    selectedVoice =
      british ||
      english[0] ||
      voices[0];
  }


  chooseVoice();


  if (
    window.speechSynthesis
  ) {

    window.speechSynthesis
      .onvoiceschanged =
      chooseVoice;
  }


  /* ==================================================
     STATE
  ================================================== */

  function setState(
    main,
    sub
  ) {

    statusMain.textContent =
      main;

    statusSub.textContent =
      sub;

    app.classList.remove(
      "listening",
      "thinking",
      "speaking"
    );


    if (main === "LISTENING") {

      app.classList.add(
        "listening"
      );
    }


    if (main === "THINKING") {

      app.classList.add(
        "thinking"
      );
    }


    if (main === "SPEAKING") {

      app.classList.add(
        "speaking"
      );
    }
  }


  /* ==================================================
     MICROPHONE
  ================================================== */

  function startListening() {

    if (
      !recognitionSupported ||
      !recognition
    ) {
      return;
    }

    if (koraSpeaking) {
      return;
    }

    if (processing) {
      return;
    }

    if (recognitionRunning) {
      return;
    }


    try {

      recognition.start();

      recognitionRunning =
        true;

    } catch (error) {

      recognitionRunning =
        false;
    }
  }


  function stopListening() {

    if (!recognition) {
      return;
    }


    try {

      recognition.stop();

    } catch (error) {
      // Already stopped.
    }


    recognitionRunning =
      false;
  }


  function restartListening() {

    if (!keepListening) {
      return;
    }

    if (koraSpeaking) {
      return;
    }

    if (processing) {
      return;
    }


    setTimeout(
      function () {

        if (
          keepListening &&
          !koraSpeaking &&
          !processing &&
          !recognitionRunning
        ) {

          startListening();
        }

      },
      300
    );
  }


  /* ==================================================
     TALK TO KORA
  ================================================== */

  async function sendToKora(
    text
  ) {

    processing =
      true;


    setState(
      "THINKING",
      "Kora is processing"
    );


    micStatus.textContent =
      "VOICE LINK PAUSED";


    messages.push({

      role: "user",

      content: text
    });


    translationText.textContent =
      text;


    try {

      const response =
        await fetch(
          CHAT_ENDPOINT,
          {

            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify({
                messages
              })
          }
        );


      const data =
        await response.json();


      if (!response.ok) {

        messages.pop();

        processing =
          false;

        showError(
          data.error ||
          "Kora couldn't respond."
        );

        setState(
          "LISTENING",
          "Kora is listening"
        );

        restartListening();

        return;
      }


      const reply =
        data.reply ||
        "I'm sorry, I didn't get that.";


      messages.push({

        role:
          "assistant",

        content:
          reply
      });


      translationText.textContent =
        reply;


      speak(reply);

    } catch (error) {

      messages.pop();

      processing =
        false;

      showError(
        "Unable to connect to Kora."
      );

      setState(
        "LISTENING",
        "Kora is listening"
      );

      restartListening();
    }
  }


  /* ==================================================
     KORA VOICE
  ================================================== */

  function speak(text) {

    if (
      !window.speechSynthesis
    ) {

      processing =
        false;

      setState(
        "LISTENING",
        "Kora is listening"
      );

      restartListening();

      return;
    }


    /*
     * ABSOLUTE ANTI-LOOP:
     *
     * Recognition is stopped BEFORE speech begins.
     */

    stopListening();


    koraSpeaking =
      true;


    setState(
      "SPEAKING",
      "Kora is responding"
    );


    micStatus.textContent =
      "VOICE OUTPUT ACTIVE";


    window.speechSynthesis.cancel();


    chooseVoice();


    const utterance =
      new SpeechSynthesisUtterance(
        text
      );


    /*
     * Calm, natural delivery.
     */

    utterance.rate =
      0.88;

    utterance.pitch =
      1.0;

    utterance.volume =
      1.0;


    if (selectedVoice) {

      utterance.voice =
        selectedVoice;
    }


    utterance.onstart =
      function () {

        koraSpeaking =
          true;
      };


    utterance.onend =
      function () {

        koraSpeaking =
          false;

        processing =
          false;


        setTimeout(
          function () {

            if (
              !keepListening
            ) {
              return;
            }


            setState(
              "LISTENING",
              "Kora is listening"
            );


            micStatus.textContent =
              "MICROPHONE ACTIVE";


            startListening();

          },
          450
        );
      };


    utterance.onerror =
      function () {

        koraSpeaking =
          false;

        processing =
          false;


        setState(
          "LISTENING",
          "Kora is listening"
        );


        micStatus.textContent =
          "MICROPHONE ACTIVE";


        restartListening();
      };


    window.speechSynthesis
      .speak(
        utterance
      );
  }


  /* ==================================================
     CORE BUTTON
  ================================================== */

  core.addEventListener(
    "click",
    function () {

      if (
        !recognitionSupported
      ) {
        return;
      }


      /*
       * If Kora is speaking,
       * clicking the core stops her.
       */

      if (koraSpeaking) {

        window.speechSynthesis
          .cancel();


        koraSpeaking =
          false;

        processing =
          false;


        setState(
          "LISTENING",
          "Kora is listening"
        );


        startListening();

        return;
      }


      /*
       * First click grants microphone
       * permission and starts Kora.
       */

      if (
        !recognitionRunning
      ) {

        keepListening =
          true;

        startListening();
      }
    }
  );


  /* ==================================================
     ERROR
  ================================================== */

  function showError(
    message
  ) {

    errorElement.textContent =
      message;

    errorElement.style.display =
      "block";


    setTimeout(
      function () {

        errorElement.style.display =
          "none";

      },
      5000
    );
  }


  /* ==================================================
     STARTUP
  ================================================== */

  if (
    recognitionSupported
  ) {

    setState(
      "READY",
      "Click the core once to activate Kora"
    );

    micStatus.textContent =
      "MICROPHONE READY";

  } else {

    setState(
      "VOICE UNAVAILABLE",
      "Use Chrome or another supported browser"
    );

    micStatus.textContent =
      "VOICE INPUT UNAVAILABLE";
  }

</script>
