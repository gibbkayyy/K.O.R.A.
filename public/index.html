<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#111214"
  >

  <meta
    name="description"
    content="K.O.R.A. — Knowledge, Operations, Reasoning & Assistance"
  >

  <link
    rel="manifest"
    href="/manifest.json"
  >

  <link
    rel="icon"
    href="/icon.svg"
    type="image/svg+xml"
  >

  <title>K.O.R.A.</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #111214;
      --bg2: #17181b;
      --panel: rgba(29, 30, 34, .86);
      --panel2: rgba(39, 40, 45, .72);
      --border: rgba(255,255,255,.11);
      --border2: rgba(255,255,255,.18);
      --text: #f4f4f5;
      --muted: #9b9ca2;
      --soft: #c9c9cd;
      --shadow: rgba(0,0,0,.45);
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      overflow-x: hidden;
    }

    body {
      min-height: 100vh;
      position: relative;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    /* =========================
       BACKGROUND
    ========================= */

    .background {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      background:
        radial-gradient(
          circle at 50% 42%,
          rgba(255,255,255,.055),
          transparent 34%
        ),
        linear-gradient(
          135deg,
          #101113,
          #16171a 50%,
          #101113
        );
    }

    .background::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: .35;
      background-image:
        linear-gradient(
          rgba(255,255,255,.035) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(255,255,255,.035) 1px,
          transparent 1px
        );
      background-size: 92px 92px;
      mask-image:
        radial-gradient(
          ellipse at center,
          black 0%,
          transparent 82%
        );
    }

    .ambient {
      position: absolute;
      width: 42vw;
      height: 42vw;
      min-width: 280px;
      min-height: 280px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,.035);
      left: 50%;
      top: 44%;
      transform: translate(-50%, -50%);
      animation: ambientPulse 6s ease-in-out infinite;
    }

    .ambient::before,
    .ambient::after {
      content: "";
      position: absolute;
      inset: 10%;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,.025);
    }

    .ambient::after {
      inset: 22%;
    }

    @keyframes ambientPulse {
      0%,100% {
        transform: translate(-50%,-50%) scale(.96);
        opacity: .45;
      }

      50% {
        transform: translate(-50%,-50%) scale(1.04);
        opacity: .8;
      }
    }

    /* =========================
       TOP BAR
    ========================= */

    .topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 66px;
      z-index: 20;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding:
        env(safe-area-inset-top)
        20px
        0
        20px;

      background: rgba(14,15,17,.72);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #f5f5f5;
      box-shadow: 0 0 14px rgba(255,255,255,.65);
    }

    .brand-name {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 3px;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 14px;
      color: var(--muted);
      font-size: 12px;
    }

    .status strong {
      color: var(--text);
      font-weight: 600;
    }

    .usage {
      display: flex;
      gap: 9px;
      align-items: center;
      padding: 7px 11px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: rgba(255,255,255,.025);
    }

    /* =========================
       MAIN
    ========================= */

    main {
      position: relative;
      z-index: 2;
      min-height: 100vh;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      padding:
        100px
        20px
        70px;
    }

    .hero {
      width: min(900px, 100%);
      text-align: center;
    }

    .orb-stage {
      position: relative;
      width: 430px;
      height: 430px;
      max-width: 90vw;
      margin: 0 auto 25px;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* =========================
       ORB
    ========================= */

    .orb {
      position: relative;
      width: 240px;
      height: 240px;

      border-radius: 50%;

      background:
        radial-gradient(
          circle at 35% 27%,
          #45474d 0%,
          #292b30 35%,
          #1c1d21 66%,
          #111214 100%
        );

      border:
        1px solid rgba(255,255,255,.32);

      box-shadow:
        inset 0 0 35px rgba(255,255,255,.06),
        0 0 45px rgba(0,0,0,.65),
        0 0 120px rgba(255,255,255,.035);

      display: flex;
      align-items: center;
      justify-content: center;

      transition:
        width .8s cubic-bezier(.2,.8,.2,1),
        height .8s cubic-bezier(.2,.8,.2,1),
        transform .8s cubic-bezier(.2,.8,.2,1),
        opacity .5s ease;
    }

    .orb::before {
      content: "";
      position: absolute;
      inset: 14px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,.14);
    }

    .orb::after {
      content: "";
      position: absolute;
      inset: 31px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,.075);
    }

    .orb-ring {
      position: absolute;
      inset: -16px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,.06);
      animation: ringRotate 15s linear infinite;
    }

    .orb-ring.two {
      inset: -28px;
      opacity: .55;
      animation-duration: 22s;
      animation-direction: reverse;
    }

    @keyframes ringRotate {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    .orb-content {
      position: relative;
      z-index: 3;
      text-align: center;
      width: 100%;
      padding: 20px;
    }

    .orb-name {
      display: block;
      width: 100%;

      color: #f7f7f8;
      font-size: 31px;
      line-height: 1;
      font-weight: 700;
      letter-spacing: 5px;

      text-shadow:
        0 0 12px rgba(255,255,255,.22);
    }

    .orb-sub {
      margin-top: 12px;
      font-size: 8px;
      letter-spacing: 4px;
      color: rgba(255,255,255,.42);
    }

    .orb.opening {
      animation:
        orbOpening 1.5s cubic-bezier(.2,.8,.2,1) forwards;
    }

    @keyframes orbOpening {
      0% {
        width: 12px;
        height: 12px;
        opacity: 0;
        transform: scale(.4);
      }

      48% {
        width: 280px;
        height: 280px;
        opacity: 1;
      }

      72% {
        width: 225px;
        height: 225px;
      }

      100% {
        width: 240px;
        height: 240px;
        transform: scale(1);
      }
    }

    .orb.opening .orb-name {
      animation:
        textFade .65s ease 1s forwards;
      opacity: 0;
    }

    .orb.opening .orb-sub {
      animation:
        textFade .65s ease 1.15s forwards;
      opacity: 0;
    }

    @keyframes textFade {
      from {
        opacity: 0;
        transform: translateY(7px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .orb.listening {
      box-shadow:
        inset 0 0 35px rgba(255,255,255,.07),
        0 0 60px rgba(255,255,255,.08);
    }

    .orb.speaking {
      animation: speakingPulse 1.4s ease-in-out infinite;
    }

    @keyframes speakingPulse {
      0%,100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.045);
      }
    }

    /* =========================
       TEXT
    ========================= */

    .welcome {
      min-height: 34px;
      margin-bottom: 18px;

      font-size: clamp(18px, 3vw, 26px);
      font-weight: 500;

      color: var(--text);

      opacity: 0;
      transform: translateY(10px);

      animation:
        heroText .7s ease 1.3s forwards;
    }

    @keyframes heroText {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .transcript {
      min-height: 28px;
      max-width: 720px;
      margin: 0 auto;

      color: var(--soft);
      font-size: 15px;
      line-height: 1.6;

      transition:
        opacity .3s ease,
        transform .3s ease;
    }

    .transcript:empty {
      opacity: 0;
    }

    /* =========================
       PANELS
    ========================= */

    .panel-area {
      width: min(900px, 100%);
      margin-top: 32px;
    }

    .info-panel {
      display: none;

      width: 100%;
      padding: 24px;

      border:
        1px solid var(--border2);

      border-radius: 20px;

      background:
        linear-gradient(
          135deg,
          rgba(255,255,255,.055),
          rgba(255,255,255,.018)
        );

      backdrop-filter: blur(20px);

      box-shadow:
        0 24px 70px rgba(0,0,0,.28);

      animation: panelIn .55s cubic-bezier(.2,.8,.2,1);
    }

    .info-panel.active {
      display: block;
    }

    @keyframes panelIn {
      from {
        opacity: 0;
        transform:
          translateY(24px)
          scale(.96);
      }

      to {
        opacity: 1;
        transform:
          translateY(0)
          scale(1);
      }
    }

    .panel-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;

      margin-bottom: 18px;
    }

    .panel-title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .panel-label {
      color: var(--muted);
      font-size: 11px;
    }

    .big-value {
      font-size: clamp(35px, 7vw, 64px);
      line-height: 1;
      font-weight: 600;
      letter-spacing: -2px;
    }

    .secondary-value {
      margin-top: 10px;
      color: var(--soft);
      font-size: 15px;
    }

    .weather-grid {
      display: grid;
      grid-template-columns:
        repeat(3, 1fr);
      gap: 10px;
      margin-top: 20px;
    }

    .weather-stat {
      padding: 15px;
      border-radius: 14px;
      background: rgba(255,255,255,.035);
      border: 1px solid var(--border);
    }

    .weather-stat span {
      display: block;
      color: var(--muted);
      font-size: 11px;
      margin-bottom: 6px;
    }

    .weather-stat strong {
      font-size: 17px;
    }

    .news-list {
      display: grid;
      gap: 10px;
    }

    .news-item {
      padding: 15px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,.025);
    }

    .news-item strong {
      display: block;
      font-size: 14px;
      line-height: 1.45;
    }

    .news-item small {
      display: block;
      margin-top: 7px;
      color: var(--muted);
    }

    /* =========================
       CONTROLS
    ========================= */

    .controls {
      position: fixed;
      left: 50%;
      bottom: 22px;
      transform: translateX(-50%);

      z-index: 30;

      display: flex;
      align-items: center;
      gap: 8px;

      padding: 7px;

      border: 1px solid var(--border);
      border-radius: 999px;

      background: rgba(19,20,22,.84);
      backdrop-filter: blur(20px);

      box-shadow:
        0 18px 45px rgba(0,0,0,.4);
    }

    .control {
      height: 42px;
      padding: 0 17px;

      border: 1px solid transparent;
      border-radius: 999px;

      color: var(--soft);
      background: transparent;

      transition:
        background .2s ease,
        color .2s ease,
        border-color .2s ease;
    }

    .control:hover {
      color: var(--text);
      background: rgba(255,255,255,.06);
      border-color: var(--border);
    }

    .control.active {
      color: var(--text);
      background: rgba(255,255,255,.09);
      border-color: var(--border2);
    }

    .install {
      display: none;
    }

    .install.visible {
      display: block;
    }

    /* =========================
       CAMERA
    ========================= */

    .camera-panel {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 100;

      align-items: center;
      justify-content: center;

      padding: 20px;

      background: rgba(7,8,9,.88);
      backdrop-filter: blur(18px);
    }

    .camera-panel.active {
      display: flex;
    }

    .camera-box {
      width: min(720px, 100%);
      overflow: hidden;

      border:
        1px solid var(--border2);

      border-radius: 22px;

      background: #18191c;
      box-shadow:
        0 30px 100px rgba(0,0,0,.55);
    }

    #camera {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      background: #08090a;
    }

    .camera-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px;
    }

    /* =========================
       TOAST
    ========================= */

    .toast {
      position: fixed;
      left: 50%;
      top: 82px;
      z-index: 200;

      transform:
        translate(-50%, -15px);

      opacity: 0;
      pointer-events: none;

      padding: 11px 16px;

      border:
        1px solid var(--border2);

      border-radius: 999px;

      background: rgba(25,26,29,.9);
      backdrop-filter: blur(18px);

      color: var(--soft);
      font-size: 12px;

      transition:
        opacity .25s ease,
        transform .25s ease;
    }

    .toast.show {
      opacity: 1;
      transform:
        translate(-50%, 0);
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 700px) {

      .topbar {
        height: 58px;
        padding-left: 13px;
        padding-right: 13px;
      }

      .status {
        gap: 7px;
      }

      .usage {
        padding: 6px 8px;
      }

      .brand-name {
        font-size: 12px;
        letter-spacing: 2px;
      }

      main {
        padding:
          85px
          14px
          90px;
      }

      .orb-stage {
        width: 320px;
        height: 320px;
        max-width: 82vw;
      }

      .orb {
        width: 185px;
        height: 185px;
      }

      .orb-name {
        font-size: 24px;
        letter-spacing: 3px;
      }

      .orb-sub {
        font-size: 6px;
        letter-spacing: 3px;
      }

      .orb-ring {
        inset: -10px;
      }

      .orb-ring.two {
        inset: -18px;
      }

      .weather-grid {
        grid-template-columns: 1fr;
      }

      .controls {
        width: calc(100% - 20px);
        justify-content: center;
      }

      .control {
        padding: 0 12px;
        font-size: 12px;
      }

      .transcript {
        font-size: 14px;
      }
    }

    @media (display-mode: standalone) {
      .install {
        display: none !important;
      }
    }
  </style>
</head>

<body>

  <div class="background">
    <div class="ambient"></div>
  </div>

  <header class="topbar">

    <div class="brand">
      <div class="brand-dot"></div>
      <div class="brand-name">K.O.R.A.</div>
    </div>

    <div class="status">
      <div>
        <strong id="statusText">
          Initialising
        </strong>
      </div>

      <div class="usage">
        <span id="tokenText">
          0 tokens
        </span>

        <span>•</span>

        <span id="requestText">
          0 requests
        </span>
      </div>
    </div>

  </header>

  <main>

    <section class="hero">

      <div class="orb-stage">

        <div
          id="orb"
          class="orb opening"
        >

          <div class="orb-ring"></div>
          <div class="orb-ring two"></div>

          <div class="orb-content">

            <span class="orb-name">
              K.O.R.A.
            </span>

            <span class="orb-sub">
              KNOWLEDGE • OPERATIONS • REASONING • ASSISTANCE
            </span>

          </div>

        </div>

      </div>

      <div
        id="welcome"
        class="welcome"
      >
        All systems online, sir.
      </div>

      <div
        id="transcript"
        class="transcript"
      ></div>

      <div class="panel-area">

        <section
          id="datePanel"
          class="info-panel"
        >
          <div class="panel-heading">
            <div class="panel-title">
              Date & Time
            </div>

            <div
              id="dateLocation"
              class="panel-label"
            >
              Local time
            </div>
          </div>

          <div
            id="bigDate"
            class="big-value"
          >
            —
          </div>

          <div
            id="bigTime"
            class="secondary-value"
          >
            —
          </div>
        </section>

        <section
          id="weatherPanel"
          class="info-panel"
        >
          <div class="panel-heading">

            <div class="panel-title">
              Weather
            </div>

            <div
              id="weatherLocation"
              class="panel-label"
            >
              Rothbury
            </div>

          </div>

          <div
            id="weatherMain"
            class="big-value"
          >
            —
          </div>

          <div
            id="weatherDescription"
            class="secondary-value"
          >
            —
          </div>

          <div class="weather-grid">

            <div class="weather-stat">
              <span>Temperature</span>
              <strong id="weatherTemp">—</strong>
            </div>

            <div class="weather-stat">
              <span>Feels like</span>
              <strong id="weatherFeels">—</strong>
            </div>

            <div class="weather-stat">
              <span>Wind</span>
              <strong id="weatherWind">—</strong>
            </div>

          </div>
        </section>

        <section
          id="newsPanel"
          class="info-panel"
        >
          <div class="panel-heading">

            <div class="panel-title">
              Latest News
            </div>

            <div class="panel-label">
              Latest headlines
            </div>

          </div>

          <div
            id="newsList"
            class="news-list"
          ></div>
        </section>

      </div>

    </section>

  </main>

  <div class="controls">

    <button
      id="micButton"
      class="control active"
      type="button"
    >
      Mic On
    </button>

    <button
      id="installButton"
      class="control install"
      type="button"
    >
      Install App
    </button>

    <button
      id="cameraButton"
      class="control"
      type="button"
    >
      Camera
    </button>

  </div>

  <div
    id="toast"
    class="toast"
  ></div>

  <div
    id="cameraPanel"
    class="camera-panel"
  >

    <div class="camera-box">

      <video
        id="camera"
        autoplay
        playsinline
        muted
      ></video>

      <div class="camera-actions">

        <button
          id="cameraClose"
          class="control"
          type="button"
        >
          Close
        </button>

        <button
          id="cameraAnalyse"
          class="control active"
          type="button"
        >
          Ask K.O.R.A. to analyse
        </button>

      </div>

    </div>

  </div>

  <script>

    /* =========================================================
       K.O.R.A. CORE
    ========================================================= */

    const KORA_MEMORY_KEY =
      "kora_permanent_memory_v1";

    const KORA_STATS_KEY =
      "kora_usage_v1";

    const DEFAULT_LOCATION =
      "Rothbury, UK";

    let recognition = null;

    let listening = true;

    let speaking = false;

    let deferredInstallPrompt = null;

    let cameraStream = null;

    let conversation = [];

    let lastSpokenText = "";

    let recognitionRestartTimer = null;

    /* =========================================================
       LOCAL MEMORY
    ========================================================= */

    function getMemory() {

      try {

        const raw =
          localStorage.getItem(
            KORA_MEMORY_KEY
          );

        if (!raw) {
          return [];
        }

        const memory =
          JSON.parse(raw);

        return Array.isArray(memory)
          ? memory
          : [];

      } catch {

        return [];

      }
    }

    function saveMemory(memory) {

      try {

        /*
         * K.O.R.A. never intentionally deletes
         * stored memory.
         */

        localStorage.setItem(
          KORA_MEMORY_KEY,
          JSON.stringify(memory)
        );

      } catch (error) {

        console.warn(
          "Unable to save K.O.R.A. memory:",
          error
        );

      }

    }

    function remember(text) {

      const clean =
        String(text || "")
          .trim();

      if (!clean) {
        return;
      }

      const memory =
        getMemory();

      const exists =
        memory.some(
          item =>
            item.toLowerCase() ===
            clean.toLowerCase()
        );

      if (!exists) {

        memory.push(clean);

        saveMemory(memory);

      }

    }

    function memoryText() {

      return getMemory()
        .map(
          (item, index) =>
            `${index + 1}. ${item}`
        )
        .join("\n");

    }

    /* =========================================================
       USAGE
    ========================================================= */

    function getStats() {

      try {

        return JSON.parse(
          localStorage.getItem(
            KORA_STATS_KEY
          ) ||
          '{"tokens":0,"requests":0}'
        );

      } catch {

        return {
          tokens: 0,
          requests: 0
        };

      }

    }

    function saveStats(stats) {

      localStorage.setItem(
        KORA_STATS_KEY,
        JSON.stringify(stats)
      );

      updateStatsUI();

    }

    function updateStatsUI() {

      const stats =
        getStats();

      document.getElementById(
        "tokenText"

    /* =========================================================
       SPEECH SYNTHESIS
    ========================================================= */

    function getFemaleVoice() {

      if (!("speechSynthesis" in window)) {
        return null;
      }

      const voices =
        speechSynthesis.getVoices();

      const preferredNames = [
        "Samantha",
        "Karen",
        "Moira",
        "Victoria",
        "Microsoft Jenny",
        "Microsoft Aria",
        "Google UK English Female",
        "Google US English Female"
      ];

      for (const name of preferredNames) {

        const found =
          voices.find(
            voice =>
              voice.name
                .toLowerCase()
                .includes(
                  name.toLowerCase()
                )
          );

        if (found) {
          return found;
        }

      }

      return (
        voices.find(
          voice =>
            /female|woman|samantha|aria|jenny|karen/i
              .test(voice.name)
        ) ||
        voices.find(
          voice =>
            /^en(-|_)/i.test(
              voice.lang
            )
        ) ||
        voices[0] ||
        null
      );

    }

    if ("speechSynthesis" in window) {

      speechSynthesis.onvoiceschanged =
        () => {
          getFemaleVoice();
        };

    }

    function stopListeningTemporarily() {

      if (!recognition) {
        return;
      }

      try {
        recognition.stop();
      } catch {}

    }

    function resumeListening() {

      if (!listening || speaking) {
        return;
      }

      if (!recognition) {
        return;
      }

      try {
        recognition.start();
      } catch {}

    }

    function speak(text) {

      if (!text) {
        return;
      }

      lastSpokenText =
        text;

      speaking = true;

      orb.classList.add(
        "speaking"
      );

      setStatus(
        "Speaking"
      );

      stopListeningTemporarily();

      if (!("speechSynthesis" in window)) {

        speaking = false;

        orb.classList.remove(
          "speaking"
        );

        resumeListening();

        return;

      }

      speechSynthesis.cancel();

      const utterance =
        new SpeechSynthesisUtterance(
          text
        );

      const voice =
        getFemaleVoice();

      if (voice) {
        utterance.voice =
          voice;
      }

      utterance.lang =
        "en-GB";

      utterance.rate =
        0.96;

      utterance.pitch =
        1.02;

      utterance.volume =
        1;

      utterance.onend =
        () => {

          speaking = false;

          orb.classList.remove(
            "speaking"
          );

          setStatus(
            listening
              ? "Listening"
              : "Ready"
          );

          setTimeout(
            resumeListening,
            180
          );

        };

      utterance.onerror =
        () => {

          speaking = false;

          orb.classList.remove(
            "speaking"
          );

          setStatus(
            listening
              ? "Listening"
              : "Ready"
          );

          setTimeout(
            resumeListening,
            180
          );

        };

      speechSynthesis.speak(
        utterance
      );

    }

    /* =========================================================
       GEMINI
    ========================================================= */

    async function askKora(userText) {

      const message =
        String(userText || "")
          .trim();

      if (!message) {
        return;
      }

      conversation.push({
        role: "user",
        content: message
      });

      conversation =
        conversation.slice(-30);

      setTranscript(
        message
      );

      setStatus(
        "Thinking"
      );

      orb.classList.add(
        "listening"
      );

      try {

        const response =
          await fetch(
            "/api/chat",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({

                messages:
                  conversation,

                memory:
                  memoryText(),

                location:
                  DEFAULT_LOCATION

              })

            }
          );

        const data =
          await response.json();

        if (!response.ok) {
          throw new Error(
            data.error ||
            "K.O.R.A. could not respond."
          );
        }

        const reply =
          String(
            data.reply ||
            ""
          ).trim();

        conversation.push({
          role: "assistant",
          content: reply
        });

        conversation =
          conversation.slice(-30);

        const stats =
          getStats();

        stats.requests =
          Number(stats.requests || 0) + 1;

        stats.tokens =
          Number(stats.tokens || 0) +
          Number(
            data?.usage?.totalTokens ||
            0
          );

        saveStats(stats);

        handleMemoryRequest(
          message
        );

        handleSpecialRequest(
          message,
          reply
        );

        setStatus(
          "Ready"
        );

        orb.classList.remove(
          "listening"
        );

        setTranscript(
          reply
        );

        speak(
          reply
        );

      } catch (error) {

        console.error(error);

        setStatus(
          "Connection Error"
        );

        orb.classList.remove(
          "listening"
        );

        const errorMessage =
          "I'm sorry, sir. I couldn't reach my AI service.";

        setTranscript(
          errorMessage
        );

        speak(
          errorMessage
        );

      }

    }

    /* =========================================================
       MEMORY COMMANDS
    ========================================================= */

    function handleMemoryRequest(
      text
    ) {

      const lower =
        text.toLowerCase();

      const triggers = [
        "remember that ",
        "remember this ",
        "remember ",
        "don't forget that ",
        "dont forget that "
      ];

      for (const trigger of triggers) {

        if (
          lower.startsWith(trigger)
        ) {

          const value =
            text
              .slice(trigger.length)
              .trim();

          if (value) {
            remember(value);
          }

          return;
        }

      }

    }

    /* =========================================================
       SPECIAL COMMANDS
    ========================================================= */

    function isDateTimeRequest(
      text
    ) {

      const lower =
        text.toLowerCase();

      return [
        "date and time",
        "show me the date",
        "show me the time",
        "what's the date",
        "whats the date",
        "what is the date",
        "what time is it",
        "pull up the date",
        "pull up the time",
        "pull up the date and time"
      ].some(
        phrase =>
          lower.includes(phrase)
      );

    }

    function isWeatherRequest(
      text
    ) {

      const lower =
        text.toLowerCase();

      return (
        lower.includes("weather") &&
        !lower.includes("remove")
      );

    }

    function isNewsRequest(
      text
    ) {

      const lower =
        text.toLowerCase();

      return (
        lower.includes("news") &&
        !lower.includes("remove")
      );

    }

    function isRemoveRequest(
      text
    ) {

      return text
        .toLowerCase()
        .includes("remove");

    }

    function handleSpecialRequest(
      text,
      reply
    ) {

      const lower =
        text.toLowerCase();

      if (
        isRemoveRequest(text)
      ) {

        if (
          lower.includes("weather")
        ) {
          hidePanel(
            "weatherPanel"
          );
        }

        if (
          lower.includes("time") ||
          lower.includes("date")
        ) {
          hidePanel(
            "datePanel"
          );
        }

        if (
          lower.includes("news")
        ) {
          hidePanel(
            "newsPanel"
          );
        }

        return;

      }

      if (
        isDateTimeRequest(text)
      ) {

        showDateTime();

        return;

      }

      if (
        isWeatherRequest(text)
      ) {

        showWeather(
          extractLocation(
            text
          )
        );

        return;

      }

      if (
        isNewsRequest(text)
      ) {

        showNews();

        return;

      }

    }

    function extractLocation(
      text
    ) {

      const match =
        text.match(
          /(?:weather|forecast)\s+(?:in|for|at)\s+(.+)/i
        );

      return match
        ? match[1].trim()
        : DEFAULT_LOCATION;

    }

    async function showWeather(
      location
    ) {

      const panel =
        document.getElementById(
          "weatherPanel"
        );

      document.getElementById(
        "weatherLocation"
      ).textContent =
        location;

      document.getElementById(
        "weatherMain"
      ).textContent =
        "Loading…";

      document.getElementById(
        "weatherDescription"
      ).textContent =
        "Retrieving current conditions.";

      panel.classList.add(
        "active"
      );

      try {

        /*
         * Open-Meteo provides weather without
         * requiring a browser API key.
         */

        const geoResponse =
          await fetch(
            "https://geocoding-api.open-meteo.com/v1/search?" +
            new URLSearchParams({
              name:
                location.replace(
                  /,\s*UK$/i,
                  ""
                ),
              count: "1",
              language: "en",
              format: "json"
            })
          );

        const geo =
          await geoResponse.json();

        const place =
          geo?.results?.[0];

        if (!place) {
          throw new Error(
            "Location not found."
          );
        }

        const weatherResponse =
          await fetch(
            "https://api.open-meteo.com/v1/forecast?" +
            new URLSearchParams({
              latitude:
                place.latitude,

              longitude:
                place.longitude,

              current:
                "temperature_2m,apparent_temperature,weather_code,wind_speed_10m",

              timezone:
                "auto"
            })
          );

        const weather =
          await weatherResponse.json();

        const current =
          weather.current;

        const description =
          weatherCodeDescription(
            current.weather_code
          );

        document.getElementById(
          "weatherMain"
        ).textContent =
          `${Math.round(
            current.temperature_2m
          )}°C`;

        document.getElementById(
          "weatherDescription"
        ).textContent =
          description;

        document.getElementById(
          "weatherTemp"
        ).textContent =
          `${Math.round(
            current.temperature_2m
          )}°C`;

        document.getElementById(
          "weatherFeels"
        ).textContent =
          `${Math.round(
            current.apparent_temperature
          )}°C`;

        document.getElementById(
          "weatherWind"
        ).textContent =
          `${Math.round(
            current.wind_speed_10m
          )} km/h`;

      } catch (error) {

        console.error(error);

        document.getElementById(
          "weatherMain"
        ).textContent =
          "Unavailable";

        document.getElementById(
          "weatherDescription"
        ).textContent =
          "I couldn't retrieve the weather right now.";

      }

    }

    function weatherCodeDescription(
      code
    ) {

      const map = {
        0: "Clear sky",
        1: "Mainly clear",
        2: "Partly cloudy",
        3: "Overcast",
        45: "Fog",
        48: "Depositing rime fog",
        51: "Light drizzle",
        53: "Moderate drizzle",
        55: "Dense drizzle",
        61: "Light rain",
        63: "Moderate rain",
        65: "Heavy rain",
        71: "Light snow",
        73: "Moderate snow",
        75: "Heavy snow",
        80: "Light rain showers",
        81: "Moderate rain showers",
        82: "Heavy rain showers",
        95: "Thunderstorm"
      };

      return (
        map[code] ||
        "Current conditions"
      );

    }

    /* =========================================================
       NEWS
    ========================================================= */

    async function showNews() {

      const panel =
        document.getElementById(
          "newsPanel"
        );

      const list =
        document.getElementById(
          "newsList"
        );

      panel.classList.add(
        "active"
      );

      list.innerHTML =
        "<div class='news-item'>Loading latest headlines…</div>";

      try {

        /*
         * The backend can be extended with
         * a news API later. For now we use
         * a public RSS-to-JSON service.
         */

        const response =
          await fetch(
            "https://api.rss2json.com/v1/api.json?" +
            new URLSearchParams({
              rss_url:
                "https://feeds.bbci.co.uk/news/rss.xml"
            })
          );

        const data =
          await response.json();

        const items =
          Array.isArray(data.items)
            ? data.items.slice(0, 6)
            : [];

        list.innerHTML =
          "";

        if (!items.length) {

          list.innerHTML =
            "<div class='news-item'>No headlines were available.</div>";

          return;

        }

        for (
          const item of items
        ) {

          const element =
            document.createElement(
              "div"
            );

          element.className =
            "news-item";

          element.innerHTML = `
            <strong>
              ${escapeHtml(
                item.title || "Headline"
              )}
            </strong>

            <small>
              ${escapeHtml(
                item.pubDate || ""
              )}
            </small>
          `;

          list.appendChild(
            element
          );

        }

      } catch {

        list.innerHTML =
          "<div class='news-item'>I couldn't retrieve the latest headlines right now.</div>";

      }

    }

    function escapeHtml(
      value
    ) {

      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

    }

    /* =========================================================
       SPEECH RECOGNITION
    ========================================================= */

    function setupRecognition() {

      const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

      if (!SpeechRecognition) {

        setStatus(
          "Voice unavailable"
        );

        document.getElementById(
          "micButton"
        ).classList.remove(
          "active"
        );

        return;

      }

      recognition =
        new SpeechRecognition();

      recognition.continuous =
        true;

      recognition.interimResults =
        false;

      recognition.lang =
        "en-GB";

      recognition.maxAlternatives =
        1;

      recognition.onstart =
        () => {

          if (!speaking) {
            setStatus(
              "Listening"
            );
          }

        };

      recognition.onresult =
        event => {

          if (speaking) {
            return;
          }

          const result =
            event.results[
              event.results.length - 1
            ];

          if (!result.isFinal) {
            return;
          }

          const text =
            result[0]?.transcript
              ?.trim();

          if (!text) {
            return;
          }

          /*
           * Don't feed speech from K.O.R.A.
           * back into K.O.R.A.
           */

          if (
            lastSpokenText &&
            isLikelyOwnSpeech(
              text
            )
          ) {
            return;
          }

          if (
            text.toLowerCase()
              .includes("hey kora") ||
            text.toLowerCase()
              .includes("hey core")
          ) {

            const cleaned =
              text
                .replace(
                  /hey\s+kora/ig,
                  ""
                )
                .replace(
                  /hey\s+core/ig,
                  ""
                )
                .trim();

            if (cleaned) {
              askKora(cleaned);
            }

            return;

          }

          askKora(text);

        };

      recognition.onerror =
        event => {

          if (
            event.error ===
            "not-allowed"
          ) {

            listening =
              false;

            setStatus(
              "Microphone blocked"
            );

            return;

          }

          if (
            event.error ===
              "aborted" ||
            event.error ===
              "no-speech"
          ) {
            return;
          }

          restartRecognition();

        };

      recognition.onend =
        () => {

          if (
            listening &&
            !speaking
          ) {

            restartRecognition();

          }

        };

      resumeListening();

    }

    function isLikelyOwnSpeech(
      text
    ) {

      if (!lastSpokenText) {
        return false;
      }

      const normalise =
        value =>
          value
            .toLowerCase()
            .replace(
              /[^a-z0-9\s]/g,
              ""
            )
            .trim();

      const a =
        normalise(
          text
        );

      const b =
        normalise(
          lastSpokenText
        );

      if (!a || !b) {
        return false;
      }

      return (
        a === b ||
        b.includes(a) ||
        a.includes(b)
      );

    }

    function restartRecognition() {

      clearTimeout(
        recognitionRestartTimer
      );

      recognitionRestartTimer =
        setTimeout(
          () => {

            if (
              !listening ||
              speaking ||
              !recognition
            ) {
              return;
            }

            try {
              recognition.start();
            } catch {}

          },
          350
        );

    }

    const cameraPanel =

    async function openCamera() {

      try {

        cameraStream =
          await navigator.mediaDevices
            .getUserMedia({
              video: {
                facingMode:
                  "environment"
              },
              audio: false
            });

        camera.srcObject =
          cameraStream;

        cameraPanel.classList.add(
          "active"
        );

        showToast(
          "Camera ready."
        );

      } catch (error) {

        console.error(error);

        showToast(
          "Camera permission was not granted."
        );

      }

    }

    document.getElementById(
      "cameraClose"
    ).addEventListener(
      "click",
      closeCamera
    );

    function closeCamera() {

      if (cameraStream) {

        cameraStream
          .getTracks()
          .forEach(
            track =>
              track.stop()
          );

      }

      cameraStream =
        null;

      camera.srcObject =
        null;

      cameraPanel.classList.remove(
        "active"
      );

    }

    document.getElementById(
      "cameraAnalyse"
    ).addEventListener(
      "click",
      analyseCamera
    );

    async function analyseCamera() {

      if (!cameraStream) {
        return;
      }

      const canvas =
        document.createElement(
          "canvas"
        );

      canvas.width =
        camera.videoWidth;

      canvas.height =
        camera.videoHeight;

      const context =
        canvas.getContext(
          "2d"
        );

      context.drawImage(
        camera,
        0,
        0,
        canvas.width,
        canvas.height
      );

      /*
       * Send the image to the existing
       * AI endpoint if it supports vision.
       */

      const image =
        canvas.toDataURL(
          "image/jpeg",
          .75
        );

      closeCamera();

      setTranscript(
        "Analysing the camera view…"
      );

      try {

        const response =
          await fetch(
            "/api/chat",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({

                messages: [
                  {
                    role: "user",
                    content:
                      "Analyse the camera image I have supplied. Describe the important objects and what you can identify."
                  }
                ],

                image,

                memory:
                  memoryText(),

                location:
                  DEFAULT_LOCATION

              })
            }
          );

        const data =
          await response.json();

        if (!response.ok) {
          throw new Error(
            data.error ||
            "Vision request failed."
          );
        }

        const reply =
          data.reply ||
          "I couldn't identify anything clearly.";

        setTranscript(
          reply
        );

        speak(
          reply
        );

      } catch {

        const reply =
          "I'm sorry, sir. I couldn't analyse the camera image.";

        setTranscript(
          reply
        );

        speak(
          reply
        );

      }

    }

    function startup() {

      updateStatsUI();

      setupRecognition();

      setStatus(
        "Systems Online"
      );

      /*
       * Wait until the orb animation is finished,
       * then give the startup message.
       */

      setTimeout(
        () => {

          const startupMessage =
            "All systems online, sir.";

          welcome.textContent =
            startupMessage;

          speak(
            startupMessage
          );

        },
        1800
      );

    }

    window.addEventListener(
      "load",
      startup
    );

  </script>

</body>
</html>
