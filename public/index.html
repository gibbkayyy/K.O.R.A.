<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<meta name="theme-color" content="#0b0c0d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="K.O.R.A.">

<link rel="manifest" href="/manifest.json">

<title>K.O.R.A.</title>

<style>
:root {
  --bg:#08090a;
  --bg2:#111315;
  --panel:rgba(19,21,23,.94);
  --white:#f4f5f3;
  --soft:#d7dad8;
  --muted:#929793;
  --dim:#626764;
  --line:rgba(255,255,255,.11);
  --line2:rgba(255,255,255,.06);
  --ease:cubic-bezier(.16,1,.3,1);
}

* {
  box-sizing:border-box;
}

html,
body {
  width:100%;
  height:100%;
  margin:0;
}

body {
  overflow:hidden;
  color:var(--white);
  background:
    radial-gradient(
      circle at 50% 42%,
      rgba(255,255,255,.055),
      transparent 25%
    ),
    linear-gradient(
      135deg,
      #070809,
      #151719,
      #08090a
    );
  font-family:
    Inter,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;
}

/* =========================
   BACKGROUND
========================= */

.background {
  position:fixed;
  inset:0;
  pointer-events:none;
  overflow:hidden;
}

.background::before {
  content:"";
  position:absolute;
  inset:-10%;
  background:
    radial-gradient(
      circle at 20% 20%,
      rgba(255,255,255,.035),
      transparent 18%
    ),
    radial-gradient(
      circle at 80% 70%,
      rgba(255,255,255,.025),
      transparent 22%
    );
}

.tech-points {
  position:absolute;
  inset:0;
}

.tech-point {
  position:absolute;
  width:3px;
  height:3px;
  border-radius:50%;
  background:rgba(255,255,255,.22);
  box-shadow:0 0 10px rgba(255,255,255,.12);
  animation:pointPulse 4s ease-in-out infinite;
}

@keyframes pointPulse {
  0%,100% { opacity:.18; transform:scale(.7); }
  50% { opacity:.65; transform:scale(1.3); }
}

/* subtle connecting lines */
.tech-line {
  position:absolute;
  height:1px;
  background:linear-gradient(
    90deg,
    transparent,
    rgba(255,255,255,.045),
    transparent
  );
  transform-origin:left center;
}

/* =========================
   APP
========================= */

.app {
  position:relative;
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
  opacity:0;
  animation:appIn .8s ease forwards;
}

@keyframes appIn {
  to { opacity:1; }
}

/* =========================
   TOP BAR
========================= */

.topbar {
  height:68px;
  padding:0 24px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:rgba(8,9,10,.72);
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(24px);
  z-index:100;
}

.brand {
  display:flex;
  align-items:center;
  gap:11px;
}

.brand-core {
  width:27px;
  height:27px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.55);
  display:grid;
  place-items:center;
  box-shadow:0 0 14px rgba(255,255,255,.07);
}

.brand-core::after {
  content:"";
  width:6px;
  height:6px;
  border-radius:50%;
  background:white;
  box-shadow:0 0 9px rgba(255,255,255,.7);
}

.brand-name {
  font-size:16px;
  font-weight:650;
  letter-spacing:.18em;
}

.brand-type {
  margin-left:8px;
  color:var(--muted);
  font-size:8px;
  letter-spacing:.14em;
}

.top-right {
  display:flex;
  align-items:center;
  gap:12px;
}

.usage {
  display:flex;
  gap:7px;
}

.usage-item {
  min-width:78px;
  padding:6px 9px;
  border:1px solid var(--line);
  border-radius:8px;
  background:rgba(255,255,255,.025);
  text-align:center;
}

.usage-label {
  display:block;
  color:var(--dim);
  font-size:7px;
  letter-spacing:.12em;
  text-transform:uppercase;
}

.usage-value {
  display:block;
  margin-top:2px;
  color:var(--soft);
  font-size:10px;
  font-weight:600;
}

.system {
  display:flex;
  align-items:center;
  gap:7px;
  color:var(--muted);
  font-size:8px;
  letter-spacing:.13em;
}

.system-dot {
  width:6px;
  height:6px;
  border-radius:50%;
  background:white;
  box-shadow:0 0 9px rgba(255,255,255,.65);
}

/* =========================
   MAIN
========================= */

.main {
  position:relative;
  flex:1;
  min-height:0;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* =========================
   CORE
========================= */

.core {
  position:absolute;
  left:50%;
  top:50%;
  width:460px;
  height:460px;
  transform:translate(-50%,-50%);
  transition:
    left 1s var(--ease),
    top 1s var(--ease),
    transform 1s var(--ease);
  z-index:5;
}

.core.info-mode {
  left:auto;
  top:auto;
  right:30px;
  bottom:15px;
  transform:translate(0,0) scale(.42);
}

.core.camera-mode {
  left:auto;
  top:auto;
  right:25px;
  bottom:15px;
  transform:translate(0,0) scale(.38);
}

/* =========================
   ORBIT
========================= */

.ring {
  position:absolute;
  left:50%;
  top:50%;
  border-radius:50%;
  transform:translate(-50%,-50%);
  pointer-events:none;
}

.ring-a {
  width:235px;
  height:235px;
  border:1px solid rgba(255,255,255,.14);
  animation:ringA 28s linear infinite;
}

.ring-b {
  width:290px;
  height:290px;
  border:1px dashed rgba(255,255,255,.07);
  animation:ringB 36s linear infinite;
}

.ring-c {
  width:345px;
  height:345px;
  border:1px solid rgba(255,255,255,.04);
}

@keyframes ringA {
  from {
    transform:translate(-50%,-50%) rotate(0deg);
  }
  to {
    transform:translate(-50%,-50%) rotate(360deg);
  }
}

@keyframes ringB {
  from {
    transform:translate(-50%,-50%) rotate(360deg);
  }
  to {
    transform:translate(-50%,-50%) rotate(0deg);
  }
}

/* =========================
   ORB
========================= */

.orb {
  position:absolute;
  left:50%;
  top:50%;
  width:180px;
  height:180px;
  padding:0;
  transform:translate(-50%,-50%) scale(.08);
  border:1px solid rgba(255,255,255,.72);
  border-radius:50%;
  background:
    radial-gradient(
      circle at 50% 42%,
      rgba(255,255,255,.12),
      rgba(28,30,32,.97) 45%,
      rgba(8,9,10,.99)
    );
  color:white;
  cursor:pointer;
  box-shadow:
    inset 0 0 35px rgba(255,255,255,.035),
    0 0 35px rgba(255,255,255,.06);
  z-index:10;
  outline:none;
  animation:orbBoot 1.5s var(--ease) .3s forwards;
}

@keyframes orbBoot {
  0% {
    width:20px;
    height:20px;
    opacity:0;
    transform:translate(-50%,-50%) scale(.08);
  }

  35% {
    opacity:1;
  }

  72% {
    transform:translate(-50%,-50%) scale(1.07);
  }

  100% {
    width:180px;
    height:180px;
    opacity:1;
    transform:translate(-50%,-50%) scale(1);
  }
}

.orb::before {
  content:"";
  position:absolute;
  inset:12px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.07);
}

.orb::after {
  content:"";
  position:absolute;
  width:66px;
  height:66px;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  border-radius:50%;
  border:1px solid rgba(255,255,255,.12);
  box-shadow:inset 0 0 20px rgba(255,255,255,.04);
}

.orb-name {
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  z-index:20;
  white-space:nowrap;
  font-size:19px;
  font-weight:500;
  letter-spacing:.17em;
  color:white;
  text-shadow:0 0 14px rgba(255,255,255,.25);
  opacity:0;
  animation:textBoot .7s ease 1.65s forwards;
}

@keyframes textBoot {
  from {
    opacity:0;
    transform:translate(-50%,-50%) scale(.8);
  }

  to {
    opacity:1;
    transform:translate(-50%,-50%) scale(1);
  }
}

/* State animation doesn't overwrite boot animation */
.app.listening .orb {
  box-shadow:
    inset 0 0 45px rgba(255,255,255,.06),
    0 0 65px rgba(255,255,255,.12);
}

.app.thinking .orb {
  animation:
    thinkPulse .8s ease-in-out infinite;
}

.app.speaking .orb {
  animation:
    speakPulse .55s ease-in-out infinite;
}

@keyframes thinkPulse {
  0%,100% {
    transform:translate(-50%,-50%) scale(1);
  }
  50% {
    transform:translate(-50%,-50%) scale(1.045);
  }
}

@keyframes speakPulse {
  0%,100% {
    transform:translate(-50%,-50%) scale(1);
  }
  50% {
    transform:translate(-50%,-50%) scale(1.065);
  }
}

/* =========================
   STATUS
========================= */

.status {
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  text-align:center;
}

.status-main {
  font-size:10px;
  font-weight:600;
  letter-spacing:.22em;
  text-transform:uppercase;
}

.status-sub {
  margin-top:7px;
  color:var(--muted);
  font-size:9px;
  letter-spacing:.08em;
}

/* =========================
   TRANSMISSION
========================= */

.transmission {
  position:absolute;
  left:24px;
  bottom:20px;
  width:min(440px,calc(100vw - 48px));
  padding:16px 18px;
  border:1px solid var(--line);
  border-radius:14px;
  background:var(--panel);
  backdrop-filter:blur(22px);
  box-shadow:0 20px 60px rgba(0,0,0,.45);
  z-index:30;
}

.transmission-title {
  color:var(--muted);
  font-size:8px;
  font-weight:650;
  letter-spacing:.17em;
  text-transform:uppercase;
  margin-bottom:9px;
}

.transmission-text {
  color:var(--soft);
  font-size:13px;
  line-height:1.5;
  min-height:20px;
}

/* =========================
   INFORMATION
========================= */

.info-panel {
  position:absolute;
  left:50%;
  top:50%;
  width:min(650px,calc(100vw - 40px));
  max-height:min(70vh,620px);
  overflow:auto;
  padding:28px;
  border:1px solid var(--line);
  border-radius:20px;
  background:rgba(17,19,21,.97);
  backdrop-filter:blur(28px);
  box-shadow:0 35px 100px rgba(0,0,0,.5);
  transform:translate(-50%,-50%) translateY(25px) scale(.96);
  opacity:0;
  pointer-events:none;
  z-index:60;
  transition:
    opacity .5s ease,
    transform .7s var(--ease);
}

.info-panel.visible {
  opacity:1;
  pointer-events:auto;
  transform:translate(-50%,-50%) translateY(0) scale(1);
}

.info-kicker {
  color:var(--muted);
  font-size:8px;
  letter-spacing:.18em;
  text-transform:uppercase;
}

.info-title {
  margin-top:8px;
  font-size:30px;
  font-weight:500;
}

.info-grid {
  margin-top:22px;
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.info-card {
  padding:16px;
  border:1px solid var(--line2);
  border-radius:12px;
  background:rgba(255,255,255,.025);
}

.info-label {
  color:var(--muted);
  font-size:8px;
  letter-spacing:.14em;
  text-transform:uppercase;
}

.info-value {
  margin-top:7px;
  font-size:17px;
  font-weight:500;
}

.info-description {
  margin-top:20px;
  color:var(--soft);
  font-size:12px;
  line-height:1.55;
}

.info-close {
  position:absolute;
  right:16px;
  top:16px;
  width:30px;
  height:30px;
  border:1px solid var(--line);
  border-radius:50%;
  background:rgba(255,255,255,.025);
  color:white;
  cursor:pointer;
}

/* =========================
   CAMERA
========================= */

.camera-panel {
  position:absolute;
  left:50%;
  top:50%;
  width:min(720px,calc(100vw - 40px));
  height:min(520px,calc(100vh - 150px));
  transform:translate(-50%,-50%) scale(.96);
  opacity:0;
  pointer-events:none;
  z-index:80;
  border:1px solid var(--line);
  border-radius:20px;
  overflow:hidden;
  background:#090a0b;
  box-shadow:0 40px 120px rgba(0,0,0,.55);
  transition:
    opacity .5s ease,
    transform .6s var(--ease);
}

.camera-panel.visible {
  opacity:1;
  pointer-events:auto;
  transform:translate(-50%,-50%) scale(1);
}

.camera-video {
  width:100%;
  height:100%;
  object-fit:cover;
  background:#050606;
}

.camera-overlay {
  position:absolute;
  inset:0;
  pointer-events:none;
  box-shadow:inset 0 0 100px rgba(0,0,0,.5);
}

.camera-top {
  position:absolute;
  left:18px;
  right:18px;
  top:16px;
  display:flex;
  justify-content:space-between;
  z-index:2;
}

.camera-label {
  padding:8px 11px;
  border:1px solid rgba(255,255,255,.12);
  border-radius:8px;
  background:rgba(5,6,7,.7);
  backdrop-filter:blur(15px);
  font-size:8px;
  letter-spacing:.15em;
}

.camera-close {
  width:34px;
  height:34px;
  border:1px solid rgba(255,255,255,.15);
  border-radius:50%;
  background:rgba(5,6,7,.72);
  color:white;
  cursor:pointer;
}

.camera-bottom {
  position:absolute;
  left:18px;
  right:18px;
  bottom:18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  z-index:3;
}

.camera-hint {
  padding:10px 12px;
  border-radius:9px;
  background:rgba(5,6,7,.72);
  backdrop-filter:blur(15px);
  color:var(--soft);
  font-size:10px;
}

.camera-snap {
  padding:10px 16px;
  border:1px solid rgba(255,255,255,.18);
  border-radius:9px;
  background:rgba(255,255,255,.08);
  color:white;
  cursor:pointer;
}

/* =========================
   INSTALL
========================= */

.install-button {
  position:fixed;
  right:24px;
  bottom:24px;
  z-index:150;
  padding:11px 15px;
  border:1px solid rgba(255,255,255,.16);
  border-radius:10px;
  background:rgba(20,22,24,.92);
  color:white;
  cursor:pointer;
  backdrop-filter:blur(18px);
  font-size:10px;
  letter-spacing:.08em;
  box-shadow:0 12px 35px rgba(0,0,0,.3);
}

.install-button.hidden {
  display:none;
}

/* =========================
   MIC
========================= */

.mic-state {
  position:fixed;
  right:24px;
  bottom:24px;
  z-index:50;
  display:flex;
  align-items:center;
  gap:7px;
  padding:9px 12px;
  border:1px solid var(--line);
  border-radius:9px;
  background:rgba(10,11,12,.75);
  backdrop-filter:blur(18px);
  color:var(--muted);
  font-size:8px;
  letter-spacing:.12em;
}

.mic-dot {
  width:6px;
  height:6px;
  border-radius:50%;
  background:white;
  box-shadow:0 0 8px rgba(255,255,255,.6);
}

/* =========================
   ERROR
========================= */

.error {
  position:fixed;
  left:50%;
  top:84px;
  transform:translateX(-50%);
  z-index:300;
  display:none;
  max-width:90%;
  padding:10px 15px;
  border:1px solid var(--line);
  border-radius:9px;
  background:rgba(15,16,17,.97);
  color:white;
  font-size:10px;
  text-align:center;
}

/* =========================
   MOBILE
========================= */

@media (max-width:700px) {

  .topbar {
    height:62px;
    padding:0 12px;
  }

  .brand-type,
  .system {
    display:none;
  }

  .brand-name {
    font-size:14px;
  }

  .usage {
    gap:4px;
  }

  .usage-item {
    min-width:58px;
    padding:6px;
  }

  .usage-label {
    font-size:6px;
  }

  .usage-value {
    font-size:9px;
  }

  .core {
    width:350px;
    height:350px;
  }

  .ring-a {
    width:200px;
    height:200px;
  }

  .ring-b {
    width:250px;
    height:250px;
  }

  .ring-c {
    width:295px;
    height:295px;
  }

  .orb {
    width:145px;
    height:145px;
  }

  .orb-name {
    font-size:16px;
    letter-spacing:.14em;
  }

  .transmission {
    left:12px;
    bottom:65px;
    width:calc(100vw - 24px);
  }

  .mic-state {
    right:12px;
    bottom:12px;
  }

  .install-button {
    right:12px;
    bottom:58px;
  }

  .info-panel {
    width:calc(100vw - 24px);
    max-height:75vh;
    padding:21px;
  }

  .info-title {
    font-size:25px;
  }

  .info-grid {
    grid-template-columns:1fr;
  }

  .camera-panel {
    width:calc(100vw - 20px);
    height:min(68vh,520px);
  }

  .camera-bottom {
    flex-direction:column;
    align-items:stretch;
    gap:8px;
  }
}

/* Installed app */
@media (display-mode:standalone) {
  .install-button {
    display:none!important;
  }
}

body.standalone .install-button {
  display:none!important;
}
</style>
</head>

<body>

<div class="background" id="background">
  <div class="tech-points" id="techPoints"></div>
</div>

<div class="app" id="app">

  <header class="topbar">

    <div class="brand">
      <div class="brand-core"></div>

      <div>
        <span class="brand-name">K.O.R.A.</span>
        <span class="brand-type">AI ASSISTANT</span>
      </div>
    </div>

    <div class="top-right">

      <div class="usage">

        <div class="usage-item">
          <span class="usage-label">Tokens</span>
          <span class="usage-value" id="tokensRemaining">—</span>
        </div>

        <div class="usage-item">
          <span class="usage-label">Requests</span>
          <span class="usage-value" id="requestsRemaining">—</span>
        </div>

      </div>

      <div class="system">
        <span class="system-dot"></span>
        ONLINE
      </div>

    </div>

  </header>

  <main class="main">

    <section class="core" id="core">

      <div class="ring ring-a"></div>
      <div class="ring ring-b"></div>
      <div class="ring ring-c"></div>

      <button
        class="orb"
        id="orb"
        aria-label="Activate Kora"
      >
        <span class="orb-name">K.O.R.A.</span>
      </button>

      <div class="status">
        <div class="status-main" id="statusMain">
          INITIALISING
        </div>

        <div class="status-sub" id="statusSub">
          Booting systems
        </div>
      </div>

    </section>

    <div class="transmission">

      <div class="transmission-title">
        Latest Transmission
      </div>

      <div
        class="transmission-text"
        id="transmission"
      >
        Initialising K.O.R.A...
      </div>

    </div>

    <section class="info-panel" id="infoPanel">

      <button
        class="info-close"
        id="infoClose"
        aria-label="Close information"
      >
        ×
      </button>

      <div class="info-kicker" id="infoKicker">
        K.O.R.A. DATA
      </div>

      <div class="info-title" id="infoTitle">
        Information
      </div>

      <div class="info-grid" id="infoGrid"></div>

      <div
        class="info-description"
        id="infoDescription"
      ></div>

    </section>

    <section class="camera-panel" id="cameraPanel">

      <video
        class="camera-video"
        id="cameraVideo"
        autoplay
        playsinline
        muted
      ></video>

      <div class="camera-overlay"></div>

      <div class="camera-top">

        <div class="camera-label">
          K.O.R.A. VISION
        </div>

        <button
          class="camera-close"
          id="cameraClose"
        >
          ×
        </button>

      </div>

      <div class="camera-bottom">

        <div class="camera-hint">
          Ask K.O.R.A. what she can see.
        </div>

        <button
          class="camera-snap"
          id="cameraSnap"
        >
          ANALYSE
        </button>

      </div>

    </section>

  </main>

</div>

<div class="mic-state">
  <span class="mic-dot"></span>
  <span id="micState">MICROPHONE ACTIVE</span>
</div>

<button
  class="install-button"
  id="installButton"
>
  INSTALL APP
</button>

<div class="error" id="error"></div>

<script>
/* =====================================================
   CONFIG
===================================================== */

const CHAT_ENDPOINT = "/api/chat";

const TTS_ENDPOINT = "/api/tts";

const NEWS_ENDPOINT = "/api/news";

const VISION_ENDPOINT = "/api/vision";

const DEFAULT_LOCATION = "Rothbury";

/* =====================================================
   ELEMENTS

/* =====================================================
   TEXT NORMALISATION
===================================================== */

function normalise(
  text
) {

  return text
    .toLowerCase()
    .replace(/[?!,.]/g, "")
    .replace(/\s+/g, " ")
    .trim();
}

/* =====================================================
   YES / NO
===================================================== */

function isYes(text) {

  const t =
    normalise(text);

  return [
    "yes",
    "yeah",
    "yep",
    "yup",
    "sure",
    "please",
    "go ahead",
    "read it",
    "read it out",
    "do it",
    "yes please",
    "yeah please"
  ].includes(t);
}

function isNo(text) {

  const t =
    normalise(text);

  return [
    "no",
    "nope",
    "nah",
    "dont",
    "don't",
    "not now",
    "no thanks"
  ].includes(t);
}

/* =====================================================
   COMMAND DETECTION
===================================================== */

function isDateTimeCommand(
  text
) {

  const t =
    normalise(text);

  return (
    t.includes("date and time") ||
    t.includes("date & time") ||
    t.includes("show me the date") ||
    t.includes("show me the time") ||
    t.includes("pull up the date") ||
    t.includes("pull up the time") ||
    t.includes("what is the date") ||
    t.includes("what's the date") ||
    t.includes("what is the time") ||
    t.includes("what's the time") ||
    t.includes("what time is it") ||
    t === "date" ||
    t === "time"
  );
}

function isWeatherCommand(
  text
) {

  const t =
    normalise(text);

  return (
    t.includes("weather") ||
    t.includes("forecast") ||
    t.includes("temperature")
  );
}

function isNewsCommand(
  text
) {

  const t =
    normalise(text);

  return (
    t === "news" ||
    t.includes("the news") ||
    t.includes("latest news") ||
    t.includes("show me the news") ||
    t.includes("pull up the news") ||
    t.includes("headlines")
  );
}

function isCameraCommand(
  text
) {

  const t =
    normalise(text);

  return (
    t.includes("look at this") ||
    t.includes("look through the camera") ||
    t.includes("use the camera") ||
    t.includes("open the camera") ||
    t.includes("what am i looking at") ||
    t.includes("what is this") ||
    t.includes("what's this") ||
    t.includes("can you see this") ||
    t.includes("look at that")
  );
}

function removeTarget(
  text
) {

  const t =
    normalise(text);

  if (
    !(
      t.includes("remove") ||
      t.includes("close") ||
      t.includes("hide")
    )
  ) {
    return null;
  }

  if (
    t.includes("weather") ||
    t.includes("forecast") ||
    t.includes("temperature")
  ) {
    return "weather";
  }

  if (
    t.includes("date") ||
    t.includes("time")
  ) {
    return "datetime";
  }

  if (
    t.includes("news") ||
    t.includes("headlines")
  ) {
    return "news";
  }

  if (
    t.includes("camera") ||
    t.includes("vision")
  ) {
    return "camera";
  }

  return null;
}

/* =====================================================
   COMMAND HANDLER
===================================================== */

async function handleCommand(
  text
) {

  if (
    awaitingReadConfirmation
  ) {

    if (isYes(text)) {

      awaitingReadConfirmation =
        false;

      if (lastInformation) {

        await speak(
          lastInformation
        );

      }

      return;
    }

    if (isNo(text)) {

      awaitingReadConfirmation =
        false;

      transmission.textContent =
        "Understood, Sir.";

      await speak(
        "Understood, Sir."
      );

      return;
    }

  }

  const target =
    removeTarget(text);

  if (target) {

    removeInformation(
      target
    );

    return;
  }

  if (
    isCameraCommand(text)
  ) {

    await openCamera();

    return;
  }

  if (
    isDateTimeCommand(text)
  ) {

    showDateTime();

    return;
  }

  if (
    isWeatherCommand(text)
  ) {

    await showWeather(
      extractWeatherLocation(text)
    );

    return;
  }

  if (
    isNewsCommand(text)
  ) {

    await showNews();

    return;
  }

  await sendToKora(
    text
  );
}

/* =====================================================
   LOCATION
===================================================== */

function extractWeatherLocation(
  text
) {

  const patterns = [

    /weather in (.+)$/i,
    /weather for (.+)$/i,
    /forecast in (.+)$/i,
    /forecast for (.+)$/i,
    /temperature in (.+)$/i,
    /temperature for (.+)$/i

  ];

  for (
    const pattern of patterns
  ) {

    const match =
      text.match(pattern);

    if (
      match &&
      match[1]
    ) {

      return match[1]
        .replace(
          /\b(today|tonight|tomorrow)\b/gi,
          ""
        )
        .trim();
    }

  }

  return DEFAULT_LOCATION;
}

/* =====================================================
   WEATHER
===================================================== */

async function showWeather(
  location
) {

  processing = true;

  setState(
    "THINKING",
    "Retrieving weather"
  );

  try {

    const geoResponse =
      await fetch(
        "https://geocoding-api.open-meteo.com/v1/search?name=" +
        encodeURIComponent(location) +
        "&count=1&language=en&format=json"
      );

    const geo =
      await geoResponse.json();

    if (
      !geo.results ||
      !geo.results.length
    ) {
      throw new Error(
        "Location not found"
      );
    }

    const place =
      geo.results[0];

    const weatherResponse =
      await fetch(
        "https://api.open-meteo.com/v1/forecast?" +
        "latitude=" +
        place.latitude +
        "&longitude=" +
        place.longitude +
        "&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m" +
        "&timezone=auto"
      );

    const weather =
      await weatherResponse.json();

    const current =
      weather.current;

    const description =
      weatherDescription(
        current.weather_code
      );

    const temperature =
      Math.round(
        current.temperature_2m
      );

    const feels =
      Math.round(
        current.apparent_temperature
      );

    const wind =
      Math.round(
        current.wind_speed_10m
      );

    currentInfo =
      "weather";

    lastInformation =
      `The weather in ${place.name} is ${description}, with a temperature of ${temperature} degrees Celsius. It feels like ${feels} degrees, with winds of ${wind} kilometres per hour.`;

    infoKicker.textContent =
      "K.O.R.A. WEATHER DATA";

    infoTitle.textContent =
      place.name;

    infoGrid.innerHTML = `

      <div class="info-card">
        <div class="info-label">
          Conditions
        </div>

        <div class="info-value">
          ${escapeHTML(description)}
        </div>
      </div>

      <div class="info-card">
        <div class="info-label">
          Temperature
        </div>

        <div class="info-value">
          ${temperature}°C
        </div>
      </div>

      <div class="info-card">
        <div class="info-label">
          Feels Like
        </div>

        <div class="info-value">
          ${feels}°C
        </div>
      </div>

      <div class="info-card">
        <div class="info-label">
          Wind
        </div>

        <div class="info-value">
          ${wind} km/h
        </div>
      </div>

    `;

    infoDescription.textContent =
      "Would you like me to read it out to you?";

    openInfo();

    awaitingReadConfirmation =
      true;

    processing = false;

    transmission.textContent =
      `Weather for ${place.name} displayed, Sir.`;

    await speak(
      `I have pulled up the weather for ${place.name}, Sir. Would you like me to read it out to you?`
    );

  } catch {

    processing = false;

    transmission.textContent =
      "I couldn't retrieve that weather data, Sir.";

    await speak(
      "I couldn't retrieve that weather data, Sir."
    );
  }
}

function weatherDescription(
  code
) {

  const map = {
    0:"Clear skies",
    1:"Mainly clear",
    2:"Partly cloudy",
    3:"Overcast",
    45:"Foggy",
    48:"Foggy",
    51:"Light drizzle",
    53:"Drizzle",
    55:"Heavy drizzle",
    61:"Light rain",
    63:"Rain",
    65:"Heavy rain",
    71:"Light snow",
    73:"Snow",
    75:"Heavy snow",
    80:"Rain showers",
    81:"Rain showers",
    82:"Heavy rain showers",
    95:"Thunderstorm",
    96:"Thunderstorm with hail",
    99:"Thunderstorm with hail"
  };

  return (
    map[code] ||
    "Variable conditions"
  );
}

/* =====================================================
   CAMERA
===================================================== */

async function openCamera() {

  if (
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ) {

    await speak(
      "Camera access isn't available in this browser, Sir."
    );

    return;
  }

  try {

    stopListening();

    cameraStream =
      await navigator.mediaDevices
        .getUserMedia({
          video:{
            facingMode:{
              ideal:"environment"
            },
            width:{
              ideal:1280
            },
            height:{
              ideal:720
            }
          },
          audio:false
        });

    cameraVideo.srcObject =
      cameraStream;

    core.classList.add(
      "camera-mode"
    );

    cameraPanel.classList.add(
      "visible"
    );

    transmission.textContent =
      "Camera active, Sir. Ask me what you'd like me to identify.";

    setState(
      "VISION ACTIVE",
      "Kora can see through the camera"
    );

    await speak(
      "Camera active, Sir. What would you like me to look at?"
    );

  } catch {

    transmission.textContent =
      "Camera permission was not granted, Sir.";

    await speak(
      "Camera permission was not granted, Sir."
    );
  }
}

function closeCamera() {

  if (
    cameraStream
  ) {

    cameraStream
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );

    cameraStream = null;
  }

  cameraVideo.srcObject =
    null;

  cameraPanel.classList.remove(
    "visible"
  );

  setTimeout(
    () => {
      core.classList.remove(
        "camera-mode"
      );
    },
    300
  );

  transmission.textContent =
    "Camera closed, Sir.";

  setState(
    "LISTENING",
    "Kora is listening"
  );

  restartListening();
}

cameraClose.addEventListener(
  "click",
  closeCamera
);

/* =====================================================
   CAMERA ANALYSIS
===================================================== */

  "click",
  analyseCamera

async function analyseCamera() {

  if (
    !cameraVideo.videoWidth
  ) {
    return;
  }

  setState(
    "ANALYSING",
    "Kora is examining the image"
  );

  micState.textContent =
    "VISION PROCESSING";

  const canvas =
    document.createElement(
      "canvas"
    );

  canvas.width =
    cameraVideo.videoWidth;

  canvas.height =
    cameraVideo.videoHeight;

  const context =
    canvas.getContext(
      "2d"
    );

  context.drawImage(
    cameraVideo,
    0,
    0,
    canvas.width,
    canvas.height
  );

  const image =
    canvas.toDataURL(
      "image/jpeg",
      .78
    );

  try {

    const response =
      await fetch(
        VISION_ENDPOINT,
        {
          method:"POST",
          headers:{
            "Content-Type":
              "application/json"
          },
          body:JSON.stringify({
            image
          })
        }
      );

    if (!response.ok) {
      throw new Error(
        "Vision unavailable"
      );
    }

    const data =
      await response.json();

    const result =
      data.reply ||
      data.description ||
      "I couldn't determine what I'm looking at.";

    transmission.textContent =
      result;

    await speak(
      result
    );

  } catch {

    transmission.textContent =
      "The camera is working, but AI vision isn't connected yet, Sir.";

    await speak(
      "The camera is working, but AI vision isn't connected yet, Sir."
    );
  }
}

/* =====================================================
   CHAT
===================================================== */

async function sendToKora(
  text
) {

  processing = true;

  setState(
    "THINKING",
    "Kora is processing"
  );

  stopListening();

  conversation.push({
    role:"user",
    content:text
  });

  saveMemory();

  transmission.textContent =
    text;

  try {

    const response =
      await fetch(
        CHAT_ENDPOINT,
        {
          method:"POST",
          headers:{
            "Content-Type":
              "application/json"
          },
          body:JSON.stringify({
            messages:[
              {
                role:"system",
                content:
`You are K.O.R.A., a calm, intelligent AI assistant.

Address the user as Sir by default.

Only use the phrase "As you wish, Sir" when the user's request is phrased as a "can you" question.

Do not use "As you wish, Sir" for ordinary questions or commands.

Never pretend to have access to private WhatsApp messages, TikTok, YouTube accounts, contacts, files, or other private information unless the application explicitly provides that data.

Be concise and natural.

If the user says "Kora", pronounce the name Kora, not "K-O-R-A" unless spelling is specifically requested.`
              },
              ...conversation
            ]
          })
        }
      );

    const data =
      await response.json();

    if (!response.ok) {

      conversation.pop();

      throw new Error(
        data.error ||
        "Kora unavailable"
      );
    }

    const reply =
      data.reply ||
      "I'm sorry, Sir. I didn't receive a response.";

    conversation.push({
      role:"assistant",
      content:reply
    });

    saveMemory();

    transmission.textContent =
      reply;

    updateUsage(
      data
    );

    await speak(
      reply
    );

  } catch {

    processing = false;

    transmission.textContent =
      "I couldn't connect to Kora, Sir.";

    setState(
      "LISTENING",
      "Kora is listening"
    );

    restartListening();
  }
}

/* =====================================================
   USAGE
===================================================== */

function updateUsage(
  data
) {

  const usage =
    data.usage ||
    data.metadata ||
    {};

  const tokens =
    usage.remainingTokens ??
    data.remainingTokens ??
    data.tokensRemaining;

  const requests =
    usage.remainingRequests ??
    data.remainingRequests ??
    data.requestsRemaining;

  if (
    tokens !== undefined &&
    tokens !== null
  ) {

    tokensRemaining.textContent =
      formatNumber(tokens);
  }

  if (
    requests !== undefined &&
    requests !== null
  ) {

    requestsRemaining.textContent =
      formatNumber(requests);
  }
}

function formatNumber(
  number
) {

  return Number(
    number
  ).toLocaleString(
    "en-GB"
  );
}

/* =====================================================
   SPEECH VOICE
===================================================== */

function selectVoice() {

  if (
    !window.speechSynthesis
  ) {
    return;
  }

  const voices =
    window.speechSynthesis
      .getVoices();

  const english =
    voices.filter(
      voice =>
        /^en(-|_)/i.test(
          voice.lang
        )
    );

  const preferred = [
    "Jenny",
    "Aria",
    "Sonia",
    "Libby",
    "Zira",
    "Karen",
    "Samantha",
    "Victoria",
    "Google UK English Female",
    "Google US English Female"
  ];

  for (
    const name of preferred
  ) {

    const voice =
      english.find(
        item =>
          item.name
            .toLowerCase()
            .includes(
              name.toLowerCase()
            )
      );

    if (voice) {

      preferredVoice =
        voice;

      return;
    }
  }

  preferredVoice =
    english.find(
      voice =>
        /GB|UK/i.test(
          voice.lang
        )
    ) ||
    english[0] ||
    voices[0];
}

selectVoice();

if (
  window.speechSynthesis
) {

  window.speechSynthesis
    .onvoiceschanged =
      selectVoice;
}

/* =====================================================
   SPEAK
===================================================== */

async function speak(
  text
) {

  stopListening();

  speaking = true;

  processing = false;

  setState(
    "SPEAKING",
    "Kora is responding"
  );

  micState.textContent =
    "VOICE OUTPUT ACTIVE";

  /*
   Try the existing Vercel TTS
   endpoint first.

   If it doesn't exist, browser
   speech automatically takes over.
  */

  try {

    const response =
      await fetch(
        TTS_ENDPOINT,
        {
          method:"POST",
          headers:{
            "Content-Type":
              "application/json"
          },
          body:JSON.stringify({
            text
          })
        }
      );

    if (
      response.ok
    ) {

      const contentType =
        response.headers
          .get(
            "content-type"
          ) || "";

      if (
        contentType.includes(
          "audio"
        )
      ) {

        const blob =
          await response.blob();

        const url =
          URL.createObjectURL(
            blob
          );

        const audio =
          new Audio(url);

        audio.onended =
          () => {

            URL.revokeObjectURL(
              url
            );

            finishSpeaking();
          };

        audio.onerror =
          () => {

            URL.revokeObjectURL(
              url
            );

            browserSpeak(
              text
            );
          };

        await audio.play();

        return;
      }
    }

  } catch {}

  browserSpeak(
    text
  );
}

function browserSpeak(
  text
) {

  if (
    !window.speechSynthesis
  ) {

    finishSpeaking();

    return;
  }

  window.speechSynthesis.cancel();

  selectVoice();

  const utterance =
    new SpeechSynthesisUtterance(
      text
    );

  if (
    preferredVoice
  ) {
    utterance.voice =
      preferredVoice;
  }

  utterance.lang =
    "en-GB";

  utterance.rate =
    .96;

  utterance.pitch =
    1.02;

  utterance.volume =
    1;

  utterance.onend =
    finishSpeaking;

  utterance.onerror =
    finishSpeaking;

  window.speechSynthesis.speak(
    utterance
  );
}

function finishSpeaking() {

  speaking = false;

  processing = false;

  micState.textContent =
    "MICROPHONE ACTIVE";

  setState(
    "LISTENING",
    "Kora is listening"
  );

  restartListening();
}

/* =====================================================
   MICROPHONE
===================================================== */

function setupRecognition() {

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (
    !SpeechRecognition
  ) {

    micState.textContent =
      "VOICE INPUT UNSUPPORTED";

    statusMain.textContent =
      "VOICE UNAVAILABLE";

    statusSub.textContent =
      "Try Chrome or Edge";

    return;
  }

  recognition =
    new SpeechRecognition();

  recognition.lang =
    "en-GB";

  recognition.interimResults =
    false;

  recognition.continuous =
    false;

  recognition.maxAlternatives =
    1;

  recognition.onstart =
    () => {

      recognitionRunning =
        true;

      setState(
        "LISTENING",
        "Kora is listening"
      );

      micState.textContent =
        "MICROPHONE ACTIVE";
    };

  recognition.onresult =
    async event => {

      recognitionRunning =
        false;

      const heard =
        event.results[0][0]
          .transcript
          .trim();

      if (!heard) {
        restartListening();
        return;
      }

      /*
       Browser recognition may return
       "hey core". Treat that as Kora.
      */

      const cleaned =
        heard.replace(
          /^hey\s+(core|kora)\b/i,
          ""
        ).trim();

      const command =
        cleaned || heard;

      transmission.textContent =
        command;

      await handleCommand(
        command
      );
    };

  recognition.onerror =
    event => {

      recognitionRunning =
        false;

      if (
        event.error ===
        "not-allowed"
      ) {

        micState.textContent =
          "MICROPHONE PERMISSION NEEDED";

        showError(
          "Please allow microphone access for K.O.R.A."
        );

        return;
      }

      restartListening();
    };

  recognition.onend =
    () => {

      recognitionRunning =
        false;

      if (
        keepListening &&
        !speaking &&
        !processing
      ) {

        restartListening();
      }
    };
}

function startListening() {

  if (
    !recognition ||
    speaking ||
    processing ||
    recognitionRunning
  ) {
    return;
  }

  try {

    recognition.start();

  } catch {

    recognitionRunning =
      false;
  }
}

function stopListening() {

  if (
    !recognition
  ) {
    return;
  }

  try {
    recognition.stop();
  } catch {}

  recognitionRunning =
    false;
}

function restartListening() {

  if (
    !keepListening ||
    speaking ||
    processing ||
    !recognition
  ) {
    return;
  }

  setTimeout(
    () => {

      if (
        keepListening &&
        !speaking &&
        !processing &&
        !recognitionRunning
      ) {

        startListening();
      }

    },
    250
  );
}

/* =====================================================
   ORB
===================================================== */

orb.addEventListener(
  "click",
  () => {

    if (
      speaking
    ) {

      if (
        window.speechSynthesis
      ) {

        window.speechSynthesis.cancel();
      }

      finishSpeaking();

      return;
    }

    startListening();
  }
);

/* =====================================================
   INSTALL APP
===================================================== */

window.addEventListener(
  "beforeinstallprompt",
  event => {

    event.preventDefault();

    deferredInstallPrompt =
      event;

    installButton.classList.remove(
      "hidden"
    );
  }
);

installButton.addEventListener(
  "click",
  async () => {

    /*
     Android / supported browsers
    */

    if (
      deferredInstallPrompt
    ) {

      deferredInstallPrompt.prompt();

      const result =
        await deferredInstallPrompt
          .userChoice;

      if (
        result.outcome ===
        "accepted"
      ) {

        installButton.classList.add(
          "hidden"
        );
      }

      deferredInstallPrompt =
        null;

      return;
    }

    /*
     iOS doesn't expose the same
     install prompt.
    */

    if (
      /iPad|iPhone|iPod/.test(
        navigator.userAgent
      ) &&
      !window.MSStream
    ) {

      showError(
        "On iPhone or iPad, tap Share, then Add to Home Screen."
      );

      return;
    }

    showError(
      "Use your browser's Install App or Add to Home Screen option."
    );
  }
);

window.addEventListener(
  "appinstalled",
  () => {

    installButton.classList.add(
      "hidden"
    );

    deferredInstallPrompt =
      null;
  }
);

/* =====================================================
   STANDALONE DETECTION
===================================================== */

function detectStandalone() {

  const standalone =
    window.matchMedia(
      "(display-mode: standalone)"
    ).matches ||
    window.navigator.standalone === true;

  if (
    standalone
  ) {

    document.body.classList.add(
      "standalone"
    );

    installButton.classList.add(
      "hidden"
    );
  }
}

detectStandalone();

/* =====================================================
   SERVICE WORKER
===================================================== */

if (
  "serviceWorker" in navigator
) {

  window.addEventListener(
    "load",
    () => {

      navigator.serviceWorker
        .register(
          "/sw.js"
        )
        .catch(
          () => {}
        );

    }
  );
}

/* =====================================================
   ERROR
===================================================== */

function showError(
  message
) {

  errorBox.textContent =
    message;

  errorBox.style.display =
    "block";

  setTimeout(
    () => {

      errorBox.style.display =
        "none";

    },
    5000
  );
}

/* =====================================================
   STARTUP
===================================================== */

function startup() {

  setupRecognition();

  setState(
    "ONLINE",
    "All systems operational"
  );

  transmission.textContent =
    "All Systems Online, Sir.";

  /*
   Some mobile browsers block
   automatic audio until the user
   interacts with the page.
  */

  speak(
    "All Systems Online, Sir."
  );
}

setTimeout(
  startup,
  1200
);

/* =====================================================
   VISIBILITY
===================================================== */

document.addEventListener(
  "visibilitychange",
  () => {

    if (
      document.hidden
    ) {

      stopListening();

      if (
        cameraStream
      ) {
        closeCamera();
      }

    } else if (
      keepListening &&
      !speaking &&
      !processing
    ) {

      restartListening();
    }

  }
);
</script>
