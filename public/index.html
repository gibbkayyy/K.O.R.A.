<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kora</title>
<style>
  :root {
    --charcoal-950: #16171a;
    --charcoal-900: #1e2024;
    --charcoal-800: #2a2d33;
    --charcoal-600: #4a4e57;
    --charcoal-400: #7a7f8a;
    --white: #f5f6f8;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--charcoal-950);
    color: var(--white);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    padding: 24px;
  }
  .title {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: var(--charcoal-400);
    text-transform: uppercase;
  }
  .orb {
    width: 140px;
    height: 140px;
    border-radius: 50%;
    background: var(--charcoal-800);
    border: 1px solid var(--charcoal-600);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 120ms ease, border-color 120ms ease;
  }
  .orb:hover { border-color: var(--white); }
  .orb.listening {
    animation: pulse 1.4s infinite ease-in-out;
    border-color: var(--white);
  }
  .orb.speaking {
    animation: pulse 0.8s infinite ease-in-out;
    border-color: var(--white);
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.06); }
  }
  .mic-icon {
    width: 40px;
    height: 40px;
    fill: var(--white);
  }
  .status {
    font-size: 14px;
    color: var(--charcoal-400);
    min-height: 20px;
    text-align: center;
    max-width: 480px;
  }
  .transcript {
    font-size: 17px;
    text-align: center;
    max-width: 560px;
    min-height: 26px;
    line-height: 1.5;
  }
  .error {
    color: var(--charcoal-400);
    font-size: 13px;
    border: 1px solid var(--charcoal-800);
    border-radius: 999px;
    padding: 8px 16px;
    display: none;
  }
</style>
</head>
<body>

  <div class="title">Kora</div>
  <div class="orb" id="orb">
    <svg class="mic-icon" viewBox="0 0 24 24">
      <path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z"/>
      <path d="M19 11a1 1 0 0 0-2 0 5 5 0 0 1-10 0 1 1 0 0 0-2 0 7 7 0 0 0 6 6.92V20H8a1 1 0 0 0 0 2h8a1 1 0 0 0 0-2h-3v-2.08A7 7 0 0 0 19 11z"/>
    </svg>
  </div>
  <div class="status" id="status">Tap to talk to Kora</div>
  <div class="transcript" id="transcript"></div>
  <div class="error" id="error"></div>

<script>
  // ------------------------------------------------------------------
  // Kora's brain lives at the same domain now (Vercel serves both the
  // frontend and the /api functions), so we can just call /api/chat
  // with a relative path - no separate backend URL needed.
  // ------------------------------------------------------------------
  const CHAT_ENDPOINT = "/api/chat";

  const orb = document.getElementById("orb");
  const statusEl = document.getElementById("status");
  const transcriptEl = document.getElementById("transcript");
  const errorEl = document.getElementById("error");

  let conversation = [];
  let isListening = false;

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    statusEl.textContent = "Your browser doesn't support voice input. Try Chrome.";
  }

  const recognition = SpeechRecognition ? new SpeechRecognition() : null;
  if (recognition) {
    recognition.lang = "en-US";
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;
  }

  orb.addEventListener("click", function () {
    if (!recognition) return;
    if (isListening) return;
    startListening();
  });

  function startListening() {
    isListening = true;
    orb.classList.add("listening");
    statusEl.textContent = "Listening...";
    errorEl.style.display = "none";
    recognition.start();
  }

  if (recognition) {
    recognition.onresult = function (event) {
      const heard = event.results[0][0].transcript;
      transcriptEl.textContent = heard;
      sendToKora(heard);
    };

    recognition.onerror = function (event) {
      isListening = false;
      orb.classList.remove("listening");
      statusEl.textContent = "Tap to talk to Kora";
      showError("Didn't catch that (" + event.error + "). Try again.");
    };

    recognition.onend = function () {
      isListening = false;
      orb.classList.remove("listening");
    };
  }

  async function sendToKora(userText) {
    statusEl.textContent = "Thinking...";
    conversation.push({ role: "user", content: userText });

    try {
      const res = await fetch(CHAT_ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: conversation })
      });

      const data = await res.json();

      if (!res.ok) {
        conversation.pop();
        showError(
          res.status === 429
            ? "Kora's thinking cap is cooling down - try again in a moment."
            : (data.error || "Something went wrong.")
        );
        statusEl.textContent = "Tap to talk to Kora";
        return;
      }

      conversation.push({ role: "assistant", content: data.reply });
      transcriptEl.textContent = data.reply;
      speak(data.reply);
    } catch (err) {
      conversation.pop();
      showError("Couldn't reach Kora. Check your connection.");
      statusEl.textContent = "Tap to talk to Kora";
    }
  }

  function speak(text) {
    if (!window.speechSynthesis) {
      statusEl.textContent = "Tap to talk to Kora";
      return;
    }

    orb.classList.add("speaking");
    statusEl.textContent = "Speaking...";

    const utterance = new SpeechSynthesisUtterance(text);
    utterance.rate = 1.02;
    utterance.pitch = 1.0;

    utterance.onend = function () {
      orb.classList.remove("speaking");
      statusEl.textContent = "Tap to talk to Kora";
    };

    window.speechSynthesis.speak(utterance);
  }

  function showError(message) {
    errorEl.textContent = message;
    errorEl.style.display = "inline-block";
  }
</script>

</body>
</html>
